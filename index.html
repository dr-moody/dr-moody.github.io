onst tileGeo = new THREE.BoxGeometry(tileSize, 0.4, tileSize);\n        const tileMat = new THREE.MeshStandardMaterial({\n            color: 0x2a2a45, // Brighter blue-grey to contrast heavily with the void\n            emissive: 0x050515,\n            roughness: 0.7,\n            metalness: 0.3\n        });\n        const edgeGeo = new THREE.EdgesGeometry(tileGeo);\n        const edgeMat = new THREE.LineBasicMaterial({ color: 0x00e5ff, linewidth: 2 });\n        \n        // DOM Elements\n        const uiStart = document.getElementById('start-screen');\n        const uiGameOver = document.getElementById('game-over-screen');\n        const uiScoreContainer = document.getElementById('hud');\n        const scoreVal = document.getElementById('score-val');\n        const finalScore = document.getElementById('final-score');\n\n        // --- Initialization ---\n        function init() {\n            // Scene Setup\n            scene = new THREE.Scene();\n            scene.background = new THREE.Color(0x000000); // Pure black void\n            scene.fog = new THREE.FogExp2(0x000000, 0.012);\n\n            // Camera Setup\n            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);\n\n            // Renderer Setup\n            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for high DPI\n            document.getElementById('game-container').appendChild(renderer.domElement);\n\n            // Lighting\n            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);\n            scene.add(ambientLight);\n\n            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);\n            directionalLight.position.set(10, 20, 10);\n            scene.add(directionalLight);\n\n            // Tunnel Group (holds all tiles and rotates the world)\n            tunnelGroup = new THREE.Group();\n            scene.add(tunnelGroup);\n\n            // Player Setup\n            const playerGeo = new THREE.BoxGeometry(1, 1, 1);\n            const playerMat = new THREE.MeshStandardMaterial({ \n                color: 0xff00ff, \n                emissive: 0xaa00aa,\n                emissiveIntensity: 0.5,\n                roughness: 0.2\n            });\n            player = new THREE.Mesh(playerGeo, playerMat);\n            \n            // Add a point light attached to the player\n            const playerLight = new THREE.PointLight(0xff00ff, 1.5, 25);\n            playerLight.position.set(0, 1.5, 0);\n            player.add(playerLight);\n            \n            scene.add(player);\n\n            // Event Listeners\n            window.addEventListener('resize', onWindowResize, false);\n            setupInput();\n\n            // Render loop\n            animate();\n        }\n\n        let isMobileMode = false;\n\n        function startGame(deviceType) {\n            isMobileMode = (deviceType === 'phone');\n            if (isMobileMode) {\n                document.getElementById('mobile-controls').style.display = 'flex';\n            } else {\n                document.getElementById('mobile-controls').style.display = 'none';\n            }\n            resetGame();\n        }\n\n        function resetGame() {\n            // Cleanup existing tiles\n            activeTiles.forEach(t => {\n                tunnelGroup.remove(t);\n                t.geometry.dispose();\n            });\n            activeTiles = [];\n            \n            // Reset Variables\n            player.position.set(0, 2, 0);\n            playerVelocityY = 0;\n            isGrounded = false;\n            \n            currentSpeed = startSpeed;\n            score = 0;\n            furthestZ = 0;\n            \n            pathX = Math.floor(gridWidth / 2);\n            \n            // Generate initial safe zone runway\n            for (let z = 5; z > -150; z -= tileSize) {\n                generateRow(z, z > -50); // Force solid path for first 50 units\n            }\n            \n            // Update UI\n            gameState = 'PLAYING';\n            uiStart.style.display = 'none';\n            uiGameOver.style.display = 'none';\n            uiScoreContainer.style.display = 'block';\n            clock.start();\n        }\n\n        function gameOver() {\n            gameState = 'GAMEOVER';\n            uiGameOver.style.display = 'flex';\n            uiScoreContainer.style.display = 'none';\n            finalScore.innerText = `Distance: ${Math.floor(score)}m`;\n        }\n\n        // --- Level Generation ---\n        function createTile(xIndex, z) {\n            const mesh = new THREE.Mesh(tileGeo, tileMat);\n            \n            // Add neon edges\n            const edges = new THREE.LineSegments(edgeGeo, edgeMat);\n            mesh.add(edges);\n            \n            // Flag for raycaster collision detection\n            mesh.userData.isTile = true;\n            \n            // Calculate position relative to the center\n            const localX = (xIndex - gridWidth / 2 + 0.5) * tileSize;\n            mesh.position.set(localX, 0, z);\n            \n            tunnelGroup.add(mesh);\n            activeTiles.push(mesh);\n        }\n\n        function generateRow(z, forceSolid = false) {\n            // 1. Move the guaranteed path walker occasionally\n            if (!forceSolid && Math.random() < 0.4) {\n                pathX += (Math.random() < 0.5 ? -1 : 1);\n                \n                // Clamp within bounds\n                pathX = Math.max(0, Math.min(gridWidth - 1, pathX));\n            }\n            \n            // 2. Generate tiles for the floor\n            for (let x = 0; x < gridWidth; x++) {\n                let shouldCreateTile = true;\n                \n                if (!forceSolid) {\n                    if (x === pathX) {\n                        shouldCreate {\n                generateRow(furthestZ - tileSize);\n            }\n\n            // Cleanup passed tiles\n            for (let i = activeTiles.length - 1; i >= 0; i--) {\n                const tile = activeTiles[i];\n                if (tile.position.z > player.position.z + 15) {\n                    tunnelGroup.remove(tile);\n                    // Dispose geometry to prevent memory leaks, materials are shared\n                    tile.geometry.dispose(); \n                    activeTiles.splice(i, 1);\n                }\n            }\n\n            // 3. Lateral Movement (Strafe)\n            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {\n                player.position.x -= moveSpeed * delta;\n                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0.2, 10 * delta); // Tilt visual\n            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {\n                player.position.x += moveSpeed * delta;\n                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -0.2, 10 * delta);\n            } else {\n                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 10 * delta);\n            }\n\n            // 4. Gravity & Jumping\n            playerVelocityY -= gravity * delta;\n            player.position.y += playerVelocityY * delta;\n\n            // 5. Collision Detection \n            const raycaster = new THREE.Raycaster(\n                player.position.clone(), \n                new THREE.Vector3(0, -1, 0),\n                0,\n                5 // Max ray distance\n            );\n            \n            const meshesOnly = tunnelGroup.children.filter(child => child.userData.isTile);\n            const intersects = raycaster.intersectObjects(meshesOnly, false);\n            \n            isGrounded = false;\n            if (intersects.length > 0) {\n                const hit = intersects[0];\n                if (hit.distance < 0.6 && playerVelocityY <= 0) {\n                    player.position.y = hit.point.y + 0.5; // Snap perfectly to the surface\n                    playerVelocityY = 0;\n                    isGrounded = true;\n                }\n            }\n\n            // Apply Jump\n            if (isGrounded && (keys['Space'] || keys['ArrowUp'] || keys['w'] || keys['W'])) {\n                playerVelocityY = jumpForce;\n                isGrounded = false;\n                keys['Space'] = false; // Require releasing key to jump again (or tap)\n            }\n\n            // 6. Death Condition (Falling into the void)\n            if (player.position.y < -15) {\n                gameOver();\n            }\n        }\n\n        // --- Input Handling ---\n        function setupInput() {\n            // Keyboard\n            window.addEventListener('keydown', (e) => {\n                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {\n                    e.preventDefault(); // Prevent page scrolling\n                }\n                keys[e.code] = true;\n                keys[e.key] = true;\n            }, {passive: false});\n\n            window.addEventListener('keyup', (e) => {\n                keys[e.code] = false;\n                keys[e.key] = false;\n            });\n\n            // Specific touch buttons for mobile controls\n            const btnLeft = document.getElementById('btn-left');\n            const btnRight = document.getElementById('btn-right');\n            const btnJump = document.getElementById('btn-jump');\n\n            const bindBtn = (element, key) => {\n                const press = (e) => { e.preventDefault(); keys[key] = true; };\n                const release = (e) => { e.preventDefault(); keys[key] = false; };\n                \n                element.addEventListener('touchstart', press, {passive: false});\n                element.addEventListener('touchend', release, {passive: false});\n                // Also bind mouse events so they work on desktop tests\n                element.addEventListener('mousedown', press);\n                element.addEventListener('mouseup', release);\n                element.addEventListener('mouseleave', release);\n            };\n\n            bindBtn(btnLeft, 'ArrowLeft');\n            bindBtn(btnRight, 'ArrowRight');\n            bindBtn(btnJump, 'Space');\n        }\n\n        function onWindowResize() {\n            camera.aspect = window.innerWidth / window.innerHeight;\n            camera.updateProjectionMatrix();\n            renderer.setSize(window.innerWidth, window.innerHeight);\n        }\n\n        // Boot\n        window.onload = init;\n    <\/script>\n<\/body>\n<\/html>", "page_1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Exodus: The Ten Plagues Challenge<\/title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        @keyframes shake {\n            0%, 100% { transform: translateX(0); }\n            25% { transform: translateX(-10px); }\n            75% { transform: translateX(10px); }\n        }\n        .animate-shake {\n            animation: shake 0.2s ease-in-out 0s 2;\n        }\n        .plague-card {\n            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);\n        }\n        .revealed {\n            background-color: #fef3c7; /* amber-100 */\n            border-color: #d97706; /* amber-600 */\n            transform: scale(1.02);\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-stone-100 min-h-screen flex flex-col items-center p-4 sm:p-8 font-serif\">\n\n    <div class=\"max-w-2xl w-full\">\n        <header class=\"text-center mb-8\">\n            <h1 class=\"text-4xl font-bold text-stone-800 mb-2\">The Ten Plagues<\/h1>\n            <p class=\"text-stone-600\">According to the King James Version<\/p>\n            <p class=\"text-sm text-stone-500 mt-2 italic\">You must guess them in sequential order (1 through 10)<\/p>\n        <\/header>\n\n        <!-- Input Area -->\n        <div class=\"relative mb-6 group\" id=\"input-container\">\n            <div id=\"buzz-overlay\" class=\"absolute inset-0 bg-red-600/90 flex items-center justify-center rounded-xl opacity-0 pointer-events-none transition-opacity duration-150 z-20\">\n                <span class=\"text-white text-4xl font-bold text-center px-4\">\u2715 WRONG ORDER OR NAME<\/span>\n            <\/div>\n            \n            <div class=\"flex flex-col sm:flex-row gap-2\">\n                <input \n                    type=\"text\" \n                    id=\"guess-input\" \n                    placeholder=\"Enter the next plague...\" \n                    class=\"flex-1 p-4 text-xl border-2 border-stone-300 rounded-xl outline-none focus:border-amber-600 transition-colors shadow-sm\"\n                    autocomplete=\"off\"\n                >\n                <button \n                    id=\"submit-btn\"\n                    class=\"bg-stone-800 text-white px-8 py-4 rounded-xl font-bold hover:bg-stone-700 active:transform active:scale-95 transition-all shadow-md\"\n                >\n                    GUESS\n                <\/button>\n            <\/div>\n            <div id=\"hint-text\" class=\"mt-2 text-center text-stone-500 text-sm h-5\"><\/div>\n        <\/div>\n\n        <!-- Give Up Button -->\n        <div class=\"flex justify-end mb-10\">\n            <button \n                id=\"give-up-btn\"\n                class=\"text-stone-500 text-sm font-semibold hover:text-stone-800 transition-colors flex items-center gap-1 p-2\"\n            >\n                <svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-4 w-4\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\n                    <path fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z\" clip-rule=\"evenodd\" />\n                <\/svg>\n                Can't remember? Reveal next\n            <\/button>\n        <\/div>\n\n        <!-- The Board -->\n        <div class=\"grid grid-cols-1 gap-3\" id=\"plague-board\">\n            <!-- Items generated via JavaScript -->\n        <\/div>\n\n        <div id=\"victory-message\" class=\"hidden mt-8 p-6 bg-green-100 border-2 border-green-600 rounded-xl text-center\">\n            <h2 class=\"text-2xl font-bold text-green-800 mb-2\">Well Done!<\/h2>\n            <p class=\"text-green-700\">You have completed the sequence of the ten plagues.<\/p>\n            <button onclick=\"location.reload()\" class=\"mt-4 text-sm underline text-green-800 font-bold\">Restart Game<\/button>\n        <\/div>\n    <\/div>\n\n    <script>\n        const PLAGUES = [\n            { name: \"blood\", display: \"Blood\" },\n            { name: \"frogs\", display: \"Frogs\" },\n            { name: \"lice\", display: \"Lice\" },\n            { name: \"flies\", display: \"Flies\" },\n            { name: \"murrain\", display: \"Murrain\" },\n            { name: \"boils\", display: \"Boils\" },\n            { name: \"hail\", display: \"Hail\" },\n            { name: \"locusts\", display: \"Locusts\" },\n            { name: \"darkness\", display: \"Darkness\" },\n            { name: \"death of the firstborn\", display: \"Death of the Firstborn\", aliases: [\"firstborn\", \"death of firstborn\"] }\n        ];\n\n        let currentStep = 0;\n        const input = document.getElementById('guess-input');\n        const submitBtn = document.getElementById('submit-btn');\n        const giveUpBtn = document.getElementById('give-up-btn');\n        const board = document.getElementById('plague-board');\n        const overlay = document.getElementById('buzz-overlay');\n        const container = document.getElementById('input-container');\n        const hintText = document.getElementById('hint-text');\n\n        function initBoard() {\n            PLAGUES.forEach((plague, index) => {\n                const div = document.createElement('div');\n                div.id = `plague-${index}`;\n                div.className = \"plague-card bg-white border-2 border-stone-200 p-4 rounded-xl shadow-sm flex items-center justify-between text-stone-400 font-bold\";\n                div.innerHTML = `\n                    <div class=\"flex items-center\">\n                        <span class=\"w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center mr-4 text-xs\">${index + 1}<\/span>\n                        <span class=\"tracking-widest opacity-50 uppercase text-sm\">Locked<\/span>\n                    <\/div>\n                    <div class=\"text-stone-200\">\u25cf \u25cf \u25cf<\/div>\n                `;\n                board.appendChild(div);\n            });\n        }\n\n        function triggerError() {\n            overlay.classList.replace('opacity-0', 'opacity-100');\n            container.classList.add('animate-shake');\n            \n            setTimeout(() => {\n                overlay.classList.replace('opacity-100', 'opacity-0');\n                container.classList.remove('animate-shake');\n                input.value = '';\n                input.focus();\n            }, 800);\n        }\n\n        function revealPlague(index, skip = false) {\n            const card = document.getElementById(`plague-${index}`);\n            card.classList.add('revealed');\n            card.classList.remove('text-stone-400');\n            card.classList.add('text-amber-900');\n            \n            const statusColor = skip ? 'text-stone-400' : 'text-amber-600';\n            const icon = skip ? \n                `<svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-6 w-6\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z\" /><\/svg>` : \n                `<svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-6 w-6\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3\" d=\"M5 13l4 4L19 7\" /><\/svg>`;\n\n            card.innerHTML = `\n                <div class=\"flex items-center\">\n                    <span class=\"w-8 h-8 rounded-full bg-amber-600 text-white flex items-center justify-center mr-4 shadow-inner\">${index + 1}<\/span>\n                    <span class=\"text-xl\">${PLAGUES[index].display}<\/span>\n                    ${skip ? '<span class=\"ml-2 text-[10px] uppercase bg-stone-200 px-1 rounded text-stone-500\">Skipped<\/span>' : ''}\n                <\/div>\n                <div class=\"${statusColor}\">\n                    ${icon}\n                <\/div>\n            `;\n\n            currentStep++;\n            input.value = '';\n            hintText.innerText = '';\n\n            if (currentStep === PLAGUES.length) {\n                input.disabled = true;\n                submitBtn.disabled = true;\n                giveUpBtn.classList.add('hidden');\n                input.placeholder = \"All plagues revealed.\";\n                document.getElementById('victory-message').classList.remove('hidden');\n            }\n        }\n\n        function checkGuess() {\n            const rawGuess = input.value.trim().toLowerCase();\n            if (!rawGuess) return;\n\n            const target = PLAGUES[currentStep];\n            const isCorrect = (rawGuess === target.name) || \n                              (target.aliases && target.aliases.includes(rawGuess));\n\n            if (isCorrect) {\n                revealPlague(currentStep);\n            } else {\n                const otherPlague = PLAGUES.find(p => p.name === rawGuess || (p.aliases && p.aliases.includes(rawGuess)));\n                if (otherPlague) {\n                    hintText.innerText = \"That is a plague, but not the next one in order!\";\n                }\n                triggerError();\n            }\n        }\n\n        submitBtn.addEventListener('click', checkGuess);\n        input.addEventListener('keypress', (e) => {\n            if (e.key === 'Enter') checkGuess();\n        });\n\n        giveUpBtn.addEventListener('click', () => {\n            if (currentStep < PLAGUES.length) {\n                revealPlague(currentStep, true);\n                input.focus();\n            }\n        });\n\n        initBoard();\n    <\/script>\n<\/body>\n<\/html>", "page_2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Speed Reader<\/title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        /* Smooth transition for the progress bar */\n        #progress-fill {\n            transition: width 0.1s linear;\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center py-10 px-4\">\n\n    <div id=\"app-container\" class=\"max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col bg-white\">\n        \n        <!-- Header / Stats -->\n        <div class=\"bg-green-600 text-white p-4 flex justify-between items-center\">\n            <h1 class=\"text-xl font-bold\">Speed Reader<\/h1>\n            <!-- Removed the live updating word text from here to reduce distraction -->\n        <\/div>\n\n        <!-- Progress Bar -->\n        <div class=\"w-full bg-gray-200 h-1.5\">\n            <div id=\"progress-fill\" class=\"bg-green-400 h-1.5 w-0\"><\/div>\n        <\/div>\n\n        <!-- Reader Display Area -->\n        <div id=\"display-container\" class=\"p-8 h-64 md:h-80 flex flex-col items-center justify-center bg-gray-50 border-b border-gray-100 relative\">\n            <div id=\"reader-display\" style=\"font-size: 24px;\" class=\"font-bold text-center leading-tight min-h-[4rem]\">\n                <span class=\"text-gray-400 font-normal\">Paste text below and press Play<\/span>\n            <\/div>\n        <\/div>\n\n        <!-- Controls Area -->\n        <div id=\"controls-area\" class=\"p-6 space-y-6\">\n            \n            <!-- Playback Controls -->\n            <div class=\"flex justify-center space-x-4\">\n                <button id=\"btn-reset\" class=\"px-4 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 transition\" title=\"Reset to start\">\n                    Reset\n                <\/button>\n                <button id=\"btn-play\" class=\"px-8 py-2 rounded-lg font-bold bg-green-600 text-white hover:bg-green-700 shadow-md transition w-32\">\n                    Play\n                <\/button>\n                <button id=\"btn-fullscreen\" class=\"px-4 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 transition\" title=\"Enter Full Screen\">\n                    Full Screen\n                <\/button>\n            <\/div>\n\n            <!-- Settings -->\n            <div class=\"flex flex-wrap gap-4 justify-center items-center bg-gray-50 p-4 rounded-xl border border-gray-100\">\n                <div class=\"flex items-center space-x-2\">\n                    <label for=\"wpm-input\" class=\"text-sm font-medium text-gray-600\">Speed (WPM):<\/label>\n                    <input type=\"number\" id=\"wpm-input\" value=\"450\" min=\"50\" max=\"2000\" step=\"10\" \n                           class=\"w-20 px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500\">\n                <\/div>\n                <div class=\"flex items-center space-x-2\">\n                    <label for=\"chunk-input\" class=\"text-sm font-medium text-gray-600\">Chunk Size:<\/label>\n                    <input type=\"number\" id=\"chunk-input\" value=\"2\" min=\"1\" max=\"10\" \n                           class=\"w-16 px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500\">\n                <\/div>\n                <div class=\"flex items-center space-x-2\">\n                    <label for=\"font-size-input\" class=\"text-sm font-medium text-gray-600\">Text Size (px):<\/label>\n                    <input type=\"number\" id=\"font-size-input\" value=\"24\" min=\"12\" max=\"100\" step=\"2\" \n                           class=\"w-16 px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500\">\n                <\/div>\n            <\/div>\n\n            <!-- Text Input -->\n            <div class=\"space-y-2\">\n                <label for=\"text-input\" class=\"block text-sm font-semibold text-gray-700\">Your Text:<\/label>\n                <textarea id=\"text-input\" rows=\"6\" \n                          class=\"w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 resize-y\" \n                          placeholder=\"Paste the article, book chapter, or text you want to speed read here...\"><\/textarea>\n                <div id=\"reading-stats\" class=\"text-sm font-medium text-gray-600 mt-1\">0 words \u2022 Est. reading time: 0 min 0 sec<\/div>\n            <\/div>\n\n        <\/div>\n    <\/div>\n\n    <script>\n        // DOM Elements\n        const display = document.getElementById('reader-display');\n        const textInput = document.getElementById('text-input');\n        const btnPlay = document.getElementById('btn-play');\n        const btnReset = document.getElementById('btn-reset');\n        const inputWpm = document.getElementById('wpm-input');\n        const inputChunk = document.getElementById('chunk-input');\n        const progressFill = document.getElementById('progress-fill');\n\n        // New DOM Elements\n        const appContainer = document.getElementById('app-container');\n        const displayContainer = document.getElementById('display-container');\n        const controlsArea = document.getElementById('controls-area');\n        const btnFullscreen = document.getElementById('btn-fullscreen');\n        const readingStats = document.getElementById('reading-stats');\n        const inputFontSize = document.getElementById('font-size-input');\n\n        // State Variables\n        let words = [];\n        let currentWordIndex = 0;\n        let isPlaying = false;\n        let timerId = null;\n        let lastLoadedText = \"\";\n\n        // Core Logic\n        function parseText() {\n            const rawText = textInput.value.trim();\n            if (rawText !== lastLoadedText) {\n                // Split text by whitespace (handles spaces, tabs, newlines)\n                words = rawText.split(/\\s+/).filter(word => word.length > 0);\n                lastLoadedText = rawText;\n                currentWordIndex = 0;\n            }\n            updateStats();\n        }\n\n        function updateStats() {\n            const wpm = parseInt(inputWpm.value) || 450;\n            const totalWords = words.length;\n            \n            if (totalWords === 0) {\n                readingStats.innerText = \"0 words \u2022 Est. reading time: 0 min 0 sec\";\n                return;\n            }\n            \n            const minutes = totalWords / wpm;\n            const mins = Math.floor(minutes);\n            const secs = Math.round((minutes - mins) * 60);\n            readingStats.innerText = `${totalWords} words \u2022 Est. reading time: ${mins} min ${secs} sec`;\n        }\n\n        function updateProgress() {\n            if (words.length === 0) {\n                progressFill.style.width = \"0%\";\n                return;\n            }\n            const percentage = (currentWordIndex / words.length) * 100;\n            progressFill.style.width = `${percentage}%`;\n        }\n\n        function step() {\n            if (!isPlaying) return;\n\n            const wpm = parseInt(inputWpm.value) || 450;\n            const chunkSize = parseInt(inputChunk.value) || 2;\n\n            // Extract the next chunk of words\n            let chunkWords = [];\n            for (let i = 0; i < chunkSize && currentWordIndex < words.length; i++) {\n                chunkWords.push(words[currentWordIndex]);\n                currentWordIndex++;\n            }\n\n            // Display chunk or stop if finished\n            if (chunkWords.length > 0) {\n                display.innerText = chunkWords.join(' ');\n                updateProgress();\n            } else {\n                pause();\n                display.innerHTML = '<span class=\"text-green-500\">Finished!<\/span>';\n                return;\n            }\n\n            // Calculate interval based on how many words are actually in THIS chunk\n            // Time per word (ms) = 60,000 ms / WPM\n            const timePerWord = 60000 / wpm;\n            const interval = timePerWord * chunkWords.length;\n\n            timerId = setTimeout(step, interval);\n        }\n\n        function play() {\n            parseText();\n            if (words.length === 0) {\n                alert(\"Please paste some text into the box first.\");\n                return;\n            }\n            \n            // If we reached the end previously, start over\n            if (currentWordIndex >= words.length) {\n                currentWordIndex = 0;\n            }\n\n            isPlaying = true;\n            btnPlay.innerText = \"Pause\";\n            btnPlay.classList.replace('bg-green-600', 'bg-red-500');\n            btnPlay.classList.replace('hover:bg-green-700', 'hover:bg-red-600');\n            \n            // Disable text area while reading\n            textInput.disabled = true;\n            textInput.classList.add('bg-gray-100');\n\n            step();\n        }\n\n        function pause() {\n            isPlaying = false;\n            clearTimeout(timerId);\n            \n            btnPlay.innerText = \"Play\";\n            btnPlay.classList.replace('bg-red-500', 'bg-green-600');\n            btnPlay.classList.replace('hover:bg-red-600', 'hover:bg-green-700');\n            \n            // Re-enable text area\n            textInput.disabled = false;\n            textInput.classList.remove('bg-gray-100');\n        }\n\n        function togglePlayState() {\n            if (isPlaying) {\n                pause();\n            } else {\n                play();\n            }\n        }\n\n        function reset() {\n            pause();\n            currentWordIndex = 0;\n            updateProgress();\n            display.innerHTML = '<span class=\"text-gray-400 font-normal\">Ready. Press Play!<\/span>';\n        }\n\n        // Event Listeners\n        btnPlay.addEventListener('click', togglePlayState);\n        btnReset.addEventListener('click', reset);\n\n        btnFullscreen.addEventListener('click', () => {\n            if (!document.fullscreenElement) {\n                appContainer.requestFullscreen().catch(err => {\n                    console.error(`Error attempting to enable fullscreen: ${err.message}`);\n                });\n            } else {\n                document.exitFullscreen();\n            }\n        });\n\n        document.addEventListener('fullscreenchange', () => {\n            if (document.fullscreenElement) {\n                controlsArea.classList.add('hidden');\n                appContainer.classList.remove('rounded-2xl', 'max-w-3xl', 'shadow-xl');\n                appContainer.classList.add('w-screen', 'h-screen');\n                displayContainer.classList.replace('h-64', 'flex-1');\n                displayContainer.classList.replace('md:h-80', 'flex-1');\n            } else {\n                controlsArea.classList.remove('hidden');\n                appContainer.classList.add('rounded-2xl', 'max-w-3xl', 'shadow-xl');\n                appContainer.classList.remove('w-screen', 'h-screen');\n                displayContainer.classList.replace('flex-1', 'h-64');\n                displayContainer.classList.replace('flex-1', 'md:h-80');\n            }\n        });\n\n        // Optional: Spacebar to play/pause (if text area is not focused)\n        document.addEventListener('keydown', (e) => {\n            // Only trigger shortcuts if not typing in inputs\n            if (document.activeElement === textInput || document.activeElement === inputWpm || document.activeElement === inputChunk || document.activeElement === inputFontSize) {\n                return;\n            }\n\n            if (e.code === 'Space') {\n                e.preventDefault(); // Prevent scrolling\n                togglePlayState();\n            } else if (e.key === '+' || e.key === '=') {\n                inputWpm.value = Math.min(2000, parseInt(inputWpm.value) + 25);\n                updateStats();\n            } else if (e.key === '-') {\n                inputWpm.value = Math.max(50, parseInt(inputWpm.value) - 25);\n                updateStats();\n            }\n        });\n        \n        // Update stats on WPM change\n        inputWpm.addEventListener('input', updateStats);\n\n        // Update display text size\n        inputFontSize.addEventListener('input', () => {\n            display.style.fontSize = `${inputFontSize.value}px`;\n        });\n\n        // Update stats on input change\n        textInput.addEventListener('input', () => {\n            if(!isPlaying) {\n                parseText();\n                updateProgress();\n            }\n        });\n\n    <\/script>\n<\/body>\n<\/html>", "page_3": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=no\">\n    <title>Voxel Terrain Explorer<\/title>\n    <style>\n        body {\n            margin: 0;\n            padding: 0;\n            overflow: hidden;\n            background-color: #87CEEB; /* Sky blue */\n            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            user-select: none;\n        }\n        \n        #canvas-container {\n            width: 100vw;\n            height: 100vh;\n            display: block;\n        }\n\n        #crosshair {\n            position: absolute;\n            top: 50%;\n            left: 50%;\n            transform: translate(-50%, -50%);\n            color: rgba(255, 255, 255, 0.8);\n            font-size: 24px;\n            font-weight: bold;\n            pointer-events: none;\n            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);\n            z-index: 10;\n        }\n\n        #ui-layer {\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            background-color: rgba(0, 0, 0, 0.6);\n            display: flex;\n            flex-direction: column;\n            justify-content: center;\n            align-items: center;\n            color: white;\n            z-index: 20;\n            transition: opacity 0.3s;\n        }\n\n        .title {\n            font-size: 48px;\n            margin-bottom: 10px;\n            text-shadow: 2px 2px 0px #333;\n            letter-spacing: 2px;\n            color: #ff4444;\n        }\n\n        .instructions {\n            font-size: 18px;\n            margin-bottom: 30px;\n            text-align: center;\n            line-height: 1.6;\n            color: #ddd;\n        }\n\n        .keys {\n            display: inline-block;\n            background: #fff;\n            color: #333;\n            padding: 3px 8px;\n            border-radius: 4px;\n            font-weight: bold;\n            box-shadow: 0 2px 0 #ccc;\n            margin: 0 4px;\n        }\n\n        .play-btn {\n            background-color: #4CAF50;\n            color: white;\n            border: none;\n            padding: 15px 40px;\n            font-size: 20px;\n            font-weight: bold;\n            border-radius: 5px;\n            cursor: pointer;\n            box-shadow: 0 4px 0 #2E7D32;\n            transition: transform 0.1s, box-shadow 0.1s;\n        }\n\n        .play-btn:active {\n            transform: translateY(4px);\n            box-shadow: 0 0 0 #2E7D32;\n        }\n\n        #loading {\n            position: absolute;\n            top: 20px;\n            left: 20px;\n            color: white;\n            font-size: 16px;\n            font-weight: bold;\n            text-shadow: 1px 1px 2px black;\n            display: none;\n        }\n\n        #timer {\n            position: absolute;\n            top: 20px;\n            right: 20px;\n            color: #ff4444;\n            font-size: 32px;\n            font-weight: bold;\n            text-shadow: 2px 2px 4px #000;\n            display: none;\n            z-index: 15;\n            font-family: monospace;\n        }\n\n        #distance-tracker {\n            position: absolute;\n            bottom: 20px;\n            left: 20px;\n            color: #ffaa00;\n            font-size: 24px;\n            font-weight: bold;\n            text-shadow: 2px 2px 4px #000;\n            display: none;\n            z-index: 15;\n            font-family: monospace;\n        }\n\n        #blood-overlay {\n            position: absolute;\n            top: 0; left: 0; width: 100%; height: 100%;\n            pointer-events: none;\n            /* Clean, deep red vignette */\n            background: radial-gradient(circle at center, transparent 50%, rgba(150, 0, 0, 0.4) 80%, rgba(150, 0, 0, 0.9) 100%);\n            box-shadow: inset 0 0 100px 30px rgba(150, 0, 0, 0.8);\n            z-index: 15;\n            display: none;\n        }\n\n        #blood-overlay.active {\n            display: block;\n            animation: jaggedPulse 0.15s infinite alternate;\n        }\n\n        @keyframes jaggedPulse {\n            0% { transform: scale(1); opacity: 0.8; }\n            100% { transform: scale(1.02); opacity: 1; }\n        }\n    <\/style>\n<\/head>\n<body>\n\n    <div id=\"canvas-container\"><\/div>\n    <div id=\"crosshair\">+<\/div>\n    <div id=\"blood-overlay\"><\/div>\n    <div id=\"loading\">Generating World...<\/div>\n    <div id=\"timer\">00:00<\/div>\n    <div id=\"distance-tracker\">Distance: 0 blocks<\/div>\n    \n    <div id=\"ui-layer\">\n        <div class=\"title\">VOXEL SURVIVAL<\/div>\n        <div class=\"instructions\">\n            Survive the creature as long as possible. It is slightly faster than you.<br>\n            Use terrain, parkour, and water strategically to slow it down.<br><br>\n            <span class=\"keys\">W<\/span> <span class=\"keys\">A<\/span> <span class=\"keys\">S<\/span> <span class=\"keys\">D<\/span> to Move<br>\n            <span class=\"keys\">SPACE<\/span> to Jump / Swim<br>\n            <span class=\"keys\">MOUSE<\/span> to Look Around\n        <\/div>\n        <button class=\"play-btn\" id=\"play-btn\">Click to Play<\/button>\n    <\/div>\n\n    <!-- Import Three.js as an ES module -->\n    <script type=\"module\">\n        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';\n\n        // --- 1. Perlin Noise Implementation (Self-Contained) ---\n        class PerlinNoise {\n            constructor() {\n                this.p = new Uint8Array(512);\n                for (let i = 0; i < 256; i++) this.p[i] = i;\n                for (let i = 255; i > 0; i--) {\n                    const j = Math.floor(Math.random() * (i + 1));\n                    const temp = this.p[i];\n                    this.p[i] = this.p[j];\n                    this.p[j] = temp;\n                }\n                for (let i = 0; i < 256; i++) this.p[i + 256] = this.p[i];\n            }\n            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }\n            lerp(t, a, b) { return a + t * (b - a); }\n            grad(hash, x, y, z) {\n                const h = hash & 15;\n                const u = h < 8 ? x : y;\n                const v = h < 4 ? y : h === 12 || h === 14 ? x : z;\n                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);\n            }\n            noise(x, y, z) {\n                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;\n                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);\n                const u = this.fade(x), v = this.fade(y), w = this.fade(z);\n                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z;\n                const B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;\n                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z),\n                                                              this.grad(this.p[BA], x - 1, y, z)),\n                                                  this.lerp(u, this.grad(this.p[AB], x, y - 1, z),\n                                                              this.grad(this.p[BB], x - 1, y - 1, z))),\n                                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1),\n                                                              this.grad(this.p[BA + 1], x - 1, y, z - 1)),\n                                                  this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1),\n                                                              this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));\n            }\n        }\n\n        // --- 2. Configuration & Constants ---\n        const CHUNK_SIZE = 16;\n        const RENDER_DISTANCE = 4;\n        const MAX_HEIGHT = 48;\n        const WATER_LEVEL = 14;\n        \n        // Block Types\n        const AIR = 0;\n        const GRASS = 1;\n        const DIRT = 2;\n        const STONE = 3;\n        const SAND = 4;\n\n        // --- 3. World Data Structure (Infinite Chunks) ---\n        const chunks = new Map();\n\n        function getChunkKey(cx, cz) {\n            return `${cx},${cz}`;\n        }\n\n        function getBlock(x, y, z) {\n            if (y < 0 || y >= MAX_HEIGHT) return AIR;\n            const cx = Math.floor(x / CHUNK_SIZE);\n            const cz = Math.floor(z / CHUNK_SIZE);\n            const chunk = chunks.get(getChunkKey(cx, cz));\n            if (!chunk) return AIR;\n            const lx = x - cx * CHUNK_SIZE;\n            const lz = z - cz * CHUNK_SIZE;\n            return chunk[lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * MAX_HEIGHT];\n        }\n\n        // --- 4. Three.js Setup ---\n        const container = document.getElementById('canvas-container');\n        const renderer = new THREE.WebGLRenderer({ antialias: false });\n        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optimize performance\n        renderer.setSize(window.innerWidth, window.innerHeight);\n        renderer.setClearColor(0x87CEEB); // Sky color\n        container.appendChild(renderer.domElement);\n\n        const scene = new THREE.Scene();\n        scene.fog = new THREE.FogExp2(0x87CEEB, 0.02); // Smooth fog for chunks\n\n        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);\n        \n        // Lighting\n        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);\n        scene.add(ambientLight);\n        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);\n        dirLight.position.set(50, 100, 50);\n        scene.add(dirLight);\n\n        // Add Infinite Water Plane\n        const waterGeo = new THREE.PlaneGeometry(1000, 1000);\n        const waterMat = new THREE.MeshLambertMaterial({ color: 0x3366ff, transparent: true, opacity: 0.7 });\n        const water = new THREE.Mesh(waterGeo, waterMat);\n        water.rotation.x = -Math.PI / 2;\n        scene.add(water);\n\n        // --- 5. Infinite Terrain Generation ---\n        const noiseGen = new PerlinNoise();\n        \n        function generateChunkData(cx, cz) {\n            const data = new Uint8Array(CHUNK_SIZE * MAX_HEIGHT * CHUNK_SIZE);\n            for (let lx = 0; lx < CHUNK_SIZE; lx++) {\n                for (let lz = 0; lz < CHUNK_SIZE; lz++) {\n                    const x = cx * CHUNK_SIZE + lx;\n                    const z = cz * CHUNK_SIZE + lz;\n                    \n                    // Multi-octave noise\n                    let nx = x / 40, nz = z / 40;\n                    let elevation = 1 * noiseGen.noise(nx, 0, nz) \n                                  + 0.5 * noiseGen.noise(nx * 2, 0, nz * 2) \n                                  + 0.25 * noiseGen.noise(nx * 4, 0, nz * 4);\n                    \n                    // Normalize and scale elevation\n                    elevation = (elevation + 1) / 2; // 0 to 1\n                    let h = Math.floor(elevation * 24) + 5; // Base height + variation\n                    \n                    // Cap height\n                    if (h >= MAX_HEIGHT) h = MAX_HEIGHT - 1;\n\n                    // Fill blocks downwards\n                    for (let y = 0; y <= h; y++) {\n                        let type = STONE;\n                        if (y === h) {\n                            type = (y <= WATER_LEVEL + 1) ? SAND : GRASS;\n                        } else if (y > h - 3) {\n                            type = DIRT;\n                        }\n                        data[lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * MAX_HEIGHT] = type;\n                    }\n                }\n            }\n            chunks.set(getChunkKey(cx, cz), data);\n        }\n\n        // --- 6. Dynamic Chunk Meshing ---\n        const chunkMeshes = new Map();\n        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);\n        const blockMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });\n        \n        const colorGrass = new THREE.Color(0x4CAF50);\n        const colorDirt = new THREE.Color(0x795548);\n        const colorStone = new THREE.Color(0x9E9E9E);\n        const colorSand = new THREE.Color(0xE6C27A);\n\n        function buildChunkMesh(cx, cz) {\n            const key = getChunkKey(cx, cz);\n            if (chunkMeshes.has(key)) {\n                const oldMesh = chunkMeshes.get(key);\n                scene.remove(oldMesh);\n                oldMesh.dispose();\n                chunkMeshes.delete(key);\n            }\n\n            const chunkData = chunks.get(key);\n            if (!chunkData) return;\n\n            const visibleBlocks = [];\n            const blockColors = [];\n            const tempColor = new THREE.Color();\n\n            // Face culling loop (Only render blocks touching AIR)\n            for (let lx = 0; lx < CHUNK_SIZE; lx++) {\n                for (let y = 0; y < MAX_HEIGHT; y++) {\n                    for (let lz = 0; lz < CHUNK_SIZE; lz++) {\n                        const type = chunkData[lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * MAX_HEIGHT];\n                        if (type === AIR) continue;\n\n                        const x = cx * CHUNK_SIZE + lx;\n                        const z = cz * CHUNK_SIZE + lz;\n\n                        // Check 6 neighbors globally\n                        const isVisible = \n                            getBlock(x+1, y, z) === AIR || getBlock(x-1, y, z) === AIR ||\n                            getBlock(x, y+1, z) === AIR || getBlock(x, y-1, z) === AIR ||\n                            getBlock(x, y, z+1) === AIR || getBlock(x, y, z-1) === AIR;\n\n                        if (isVisible) {\n                            visibleBlocks.push({ x, y, z });\n                            \n                            let baseCol;\n                            if (type === GRASS) baseCol = colorGrass;\n                            else if (type === DIRT) baseCol = colorDirt;\n                            else if (type === STONE) baseCol = colorStone;\n                            else if (type === SAND) baseCol = colorSand;\n\n                            let noiseVal = noiseGen.noise(x*0.5, y*0.5, z*0.5) * 0.05;\n                            tempColor.copy(baseCol).offsetHSL(0, 0, noiseVal);\n                            blockColors.push(tempColor.r, tempColor.g, tempColor.b);\n                        }\n                    }\n                }\n            }\n\n            if (visibleBlocks.length === 0) return;\n\n            const mesh = new THREE.InstancedMesh(boxGeometry, blockMaterial, visibleBlocks.length);\n            const matrix = new THREE.Matrix4();\n            const color = new THREE.Color();\n\n            for (let i = 0; i < visibleBlocks.length; i++) {\n                const pos = visibleBlocks[i];\n                matrix.setPosition(pos.x + 0.5, pos.y + 0.5, pos.z + 0.5); // Center block\n                mesh.setMatrixAt(i, matrix);\n                \n                color.setRGB(blockColors[i*3], blockColors[i*3+1], blockColors[i*3+2]);\n                mesh.setColorAt(i, color);\n            }\n\n            scene.add(mesh);\n            chunkMeshes.set(key, mesh);\n        }\n\n        let lastPlayerChunkX = -999;\n        let lastPlayerChunkZ = -999;\n\n        function updateChunks() {\n            const pcx = Math.floor(player.x / CHUNK_SIZE);\n            const pcz = Math.floor(player.z / CHUNK_SIZE);\n\n            if (pcx !== lastPlayerChunkX || pcz !== lastPlayerChunkZ) {\n                lastPlayerChunkX = pcx;\n                lastPlayerChunkZ = pcz;\n\n                const keepChunks = new Set();\n\n                // 1. Generate data for all nearby chunks\n                for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {\n                    for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {\n                        const cx = pcx + dx;\n                        const cz = pcz + dz;\n                        const key = getChunkKey(cx, cz);\n                        keepChunks.add(key);\n                        if (!chunks.has(key)) generateChunkData(cx, cz);\n                    }\n                }\n\n                // 2. Build meshes\n                for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {\n                    for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {\n                        const cx = pcx + dx;\n                        const cz = pcz + dz;\n                        const key = getChunkKey(cx, cz);\n                        if (!chunkMeshes.has(key)) buildChunkMesh(cx, cz);\n                    }\n                }\n\n                // 3. Unload distant chunks meshes\n                for (const [key, mesh] of chunkMeshes.entries()) {\n                    if (!keepChunks.has(key)) {\n                        scene.remove(mesh);\n                        mesh.dispose();\n                        chunkMeshes.delete(key);\n                    }\n                }\n            }\n        }\n\n        // Initialize world async so UI updates\n        document.getElementById('loading').style.display = 'block';\n        setTimeout(() => {\n            updateChunks();\n            document.getElementById('loading').style.display = 'none';\n        }, 50);\n\n        // --- 7. Player Physics & Controls ---\n        const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);\n        const playerMat = new THREE.MeshLambertMaterial({ color: 0x2288ff }); // Blue shirt\n        const playerMesh = new THREE.Mesh(playerGeo, playerMat);\n        playerMesh.visible = false;\n        scene.add(playerMesh);\n\n        const player = {\n            x: 0,\n            y: MAX_HEIGHT + 10, // Spawn high up\n            z: 0,\n            radius: 0.3,   // Bounding box radius (width/2)\n            height: 1.6,   // Bounding box height\n            vx: 0, vy: 0, vz: 0,\n            onGround: false,\n            mesh: playerMesh\n        };\n\n        // --- 7.5 Enemy & Game State ---\n        const enemyGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);\n        const enemyMat = new THREE.MeshLambertMaterial({ color: 0xff0000, emissive: 0x880000 });\n        const enemyMesh = new THREE.Mesh(enemyGeo, enemyMat);\n        scene.add(enemyMesh);\n\n        const enemy = {\n            x: 25, y: MAX_HEIGHT + 10, z: 25,\n            radius: 0.4, height: 1.8,\n            vx: 0, vy: 0, vz: 0,\n            baseSpeed: 5.1, // Starts just slightly faster than player\n            speed: 5.1,     // Current speed (increases over time)\n            onGround: false,\n            mesh: enemyMesh\n        };\n\n        let gameActive = false;\n        let survivalTimeMs = 0;\n        let isDead = false;\n        let deathAnimationTimer = 0;\n\n        function formatTime(ms) {\n            let totalSeconds = Math.floor(ms / 1000);\n            let minutes = Math.floor(totalSeconds / 60);\n            let seconds = totalSeconds % 60;\n            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n        }\n\n        function resetGame() {\n            player.x = 0;\n            player.y = MAX_HEIGHT + 10;\n            player.z = 0;\n            player.vx = player.vy = player.vz = 0;\n\n            isDead = false;\n            player.mesh.visible = false;\n            player.mesh.scale.set(1, 1, 1);\n            player.mesh.material.color.setHex(0x2288ff);\n\n            // Spawn enemy far away randomly\n            let angle = Math.random() * Math.PI * 2;\n            enemy.x = Math.cos(angle) * 30;\n            enemy.z = Math.sin(angle) * 30;\n            enemy.y = MAX_HEIGHT + 10;\n            enemy.vx = enemy.vy = enemy.vz = 0;\n            enemy.speed = enemy.baseSpeed; // Reset speed\n\n            survivalTimeMs = 0;\n            document.getElementById('timer').style.display = 'block';\n            document.getElementById('timer').innerText = \"00:00\";\n            document.getElementById('distance-tracker').style.display = 'block';\n            document.getElementById('distance-tracker').innerText = \"Distance: 30 blocks\";\n            document.getElementById('blood-overlay').classList.remove('active');\n        }\n\n        function gameOver() {\n            gameActive = false;\n            isDead = true;\n            deathAnimationTimer = 0;\n\n            document.exitPointerLock();\n\n            // Flash the bloody jagged screen overlay\n            document.getElementById('blood-overlay').classList.add('active');\n\n            // Reveal player body for the animation\n            player.mesh.visible = true;\n            player.mesh.position.set(player.x, player.y + player.height / 2, player.z);\n\n            // Calculate 3rd-person camera positioning\n            let dx = player.x - enemy.x;\n            let dz = player.z - enemy.z;\n            let dist = Math.sqrt(dx*dx + dz*dz) || 1;\n            let dirX = dx / dist;\n            let dirZ = dz / dist;\n\n            // Push the monster back a few blocks to setup the jump\n            enemy.x = player.x - dirX * 2.5;\n            enemy.z = player.z - dirZ * 2.5;\n            enemy.y = player.y; // Ground it\n\n            // Position camera behind player so we look back at the monster\n            camera.position.set(player.x + dirX * 5, player.y + 3.5, player.z + dirZ * 5);\n\n            document.getElementById('timer').style.display = 'none';\n            document.getElementById('distance-tracker').style.display = 'none';\n\n            // Delay UI to let animation play out\n            setTimeout(() => {\n                document.getElementById('blood-overlay').classList.remove('active');\n                uiLayer.style.display = 'flex';\n                void uiLayer.offsetWidth; \n                uiLayer.style.opacity = '1';\n                uiLayer.querySelector('.title').innerText = \"YOU DIED\";\n                uiLayer.querySelector('.instructions').innerHTML = `You survived for: <b style=\"color:#ff4444; font-size:24px;\">${formatTime(survivalTimeMs)}<\/b><br><br>The creature ate you.`;\n                playBtn.innerText = \"Try Again\";\n            }, 4500); // Increased from 3000 to accommodate the dramatic pause\n        }\n\n        // Inputs\n        const keys = { w: false, a: false, s: false, d: false, space: false };\n        \n        // Pointer Lock & Camera Rotation Variables\n        let isLocked = false;\n        let pitch = 0; // up/down\n        let yaw = 0;   // left/right\n        const PI_2 = Math.PI / 2;\n\n        const uiLayer = document.getElementById('ui-layer');\n        const playBtn = document.getElementById('play-btn');\n\n        // Setup Pointer Lock\n        playBtn.addEventListener('click', () => {\n            document.body.requestPointerLock();\n        });\n\n        document.addEventListener('pointerlockchange', () => {\n            if (document.pointerLockElement === document.body) {\n                isLocked = true;\n                if (!gameActive || isDead) {\n                    resetGame();\n                    gameActive = true;\n                }\n                uiLayer.style.opacity = '0';\n                setTimeout(() => { if (isLocked) uiLayer.style.display = 'none'; }, 300);\n            } else {\n                isLocked = false;\n                keys.w = keys.a = keys.s = keys.d = keys.space = false;\n                \n                if (isDead) {\n                    // Do nothing, let the 3s death timeout reveal the UI\n                } else {\n                    uiLayer.style.display = 'flex';\n                    // Trigger reflow\n                    void uiLayer.offsetWidth; \n                    uiLayer.style.opacity = '1';\n                    \n                    if (gameActive) {\n                        uiLayer.querySelector('.title').innerText = \"PAUSED\";\n                        uiLayer.querySelector('.instructions').innerHTML = `Surviving for: <b>${formatTime(survivalTimeMs)}<\/b><br><br>Press Resume to continue.`;\n                        playBtn.innerText = \"Resume\";\n                    }\n                }\n            }\n        });\n\n        // Mouse Move -> Camera Look\n        document.addEventListener('mousemove', (e) => {\n            if (!isLocked) return;\n            const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;\n            const movementY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;\n\n            yaw -= movementX * 0.002;\n            pitch -= movementY * 0.002;\n\n            // Clamp pitch to look straight up/down safely\n            pitch = Math.max(-PI_2 + 0.01, Math.min(PI_2 - 0.01, pitch));\n        });\n\n        // Keyboard Inputs\n        document.addEventListener('keydown', (e) => {\n            if (!isLocked) return;\n            switch(e.code) {\n                case 'KeyW': keys.w = true; break;\n                case 'KeyA': keys.a = true; break;\n                case 'KeyS': keys.s = true; break;\n                case 'KeyD': keys.d = true; break;\n                case 'Space': keys.space = true; break;\n            }\n        });\n\n        document.addEventListener('keyup', (e) => {\n            switch(e.code) {\n                case 'KeyW': keys.w = false; break;\n                case 'KeyA': keys.a = false; break;\n                case 'KeyS': keys.s = false; break;\n                case 'KeyD': keys.d = false; break;\n                case 'Space': keys.space = false; break;\n            }\n        });\n\n        // --- 8. Collision Logic ---\n        function isColliding(px, py, pz, radius, height) {\n            // Get bounding box limits in grid coordinates\n            const minX = Math.floor(px - radius);\n            const maxX = Math.floor(px + radius);\n            const minY = Math.floor(py);\n            const maxY = Math.floor(py + height);\n            const minZ = Math.floor(pz - radius);\n            const maxZ = Math.floor(pz + radius);\n\n            // Check all blocks intersecting the bounding box\n            for (let x = minX; x <= maxX; x++) {\n                for (let y = minY; y <= maxY; y++) {\n                    for (let z = minZ; z <= maxZ; z++) {\n                        if (getBlock(x, y, z) !== AIR) {\n                            return true; // Collision detected\n                        }\n                    }\n                }\n            }\n            return false;\n        }\n\n        // --- 9. Game Loop & Physics ---\n        let lastTime = performance.now();\n\n        function animate() {\n            requestAnimationFrame(animate);\n\n            const time = performance.now();\n            let dt = (time - lastTime) / 1000;\n            lastTime = time;\n            \n            // Cap delta time to prevent clipping on lag spikes\n            if (dt > 0.1) dt = 0.1; \n\n            if (isDead) {\n                // --- DEATH ANIMATION SEQUENCE ---\n                deathAnimationTimer += dt;\n\n                if (deathAnimationTimer < 1.5) {\n                    // Dramatic pause for 1.5 seconds so the player can process the 3rd person view\n                    enemy.mesh.position.set(enemy.x, enemy.y + enemy.height / 2, enemy.z);\n                } else if (deathAnimationTimer < 4.0) {\n                    let attackTime = deathAnimationTimer - 1.5;\n\n                    if (attackTime < 0.3) {\n                        // The initial cinematic tackle jump\n                        let jumpProgress = attackTime / 0.3; // 0 to 1\n                        enemy.x += (player.x - enemy.x) * 8 * dt;\n                        enemy.z += (player.z - enemy.z) * 8 * dt;\n                        enemy.y = player.y + Math.sin(jumpProgress * Math.PI) * 1.5; // Arc up and down\n                    } else {\n                        // The eating frenzy\n                        enemy.x += (player.x - enemy.x) * 5 * dt;\n                        enemy.z += (player.z - enemy.z) * 5 * dt;\n                        enemy.y = player.y + Math.abs(Math.sin(attackTime * 15)) * 0.8;\n\n                        // Squish the player into the ground\n                        player.mesh.scale.y = Math.max(0.1, 1 - (attackTime - 0.3) * 0.4);\n                        player.mesh.position.y = player.y + (1.6 * player.mesh.scale.y) / 2;\n\n                        // Flash player red (blood/damage)\n                        if (Math.floor(attackTime * 10) % 2 === 0) {\n                            player.mesh.material.color.setHex(0xff0000);\n                        } else {\n                            player.mesh.material.color.setHex(0x2288ff);\n                        }\n                    }\n                    enemy.mesh.position.set(enemy.x, enemy.y + enemy.height / 2, enemy.z);\n                } else if (deathAnimationTimer >= 4.0 && deathAnimationTimer < 4.1) {\n                    player.mesh.visible = false; // Player has been fully eaten\n                }\n\n            } else if (isLocked) {\n                updateChunks();\n\n                if (gameActive) {\n                    survivalTimeMs += dt * 1000;\n                    document.getElementById('timer').innerText = formatTime(survivalTimeMs);\n                    \n                    // The creature gets faster the longer you survive (+0.015 speed per second)\n                    enemy.speed += 0.015 * dt;\n                }\n\n                // --- Player Physics ---\n                const inWater = player.y < WATER_LEVEL + 0.8;\n\n                let forward = 0;\n                let right = 0;\n                if (keys.w) forward += 1;\n                if (keys.s) forward -= 1;\n                if (keys.d) right += 1;\n                if (keys.a) right -= 1;\n\n                if (forward !== 0 || right !== 0) {\n                    const len = Math.sqrt(forward * forward + right * right);\n                    forward /= len;\n                    right /= len;\n                }\n\n                // Slower movement if in water\n                const currentSpeed = inWater ? 2.0 : 5.0;\n                const targetVx = (forward * Math.sin(yaw) - right * Math.cos(yaw)) * currentSpeed;\n                const targetVz = (forward * Math.cos(yaw) + right * Math.sin(yaw)) * currentSpeed;\n\n                const friction = player.onGround ? 10 : (inWater ? 4 : 2);\n                player.vx += (targetVx - player.vx) * friction * dt;\n                player.vz += (targetVz - player.vz) * friction * dt;\n\n                // Gravity, Jumping & Swimming\n                if (inWater) {\n                    player.vy -= 8 * dt; // Buoyant/Slower gravity\n                    if (player.vy < -4) player.vy = -4; // Slower terminal velocity in water\n                    if (keys.space) {\n                        player.vy += 15 * dt; // Swim upwards\n                        if (player.vy > 5) player.vy = 5; // Max swim speed (high enough to pop out onto blocks)\n                    }\n                } else {\n                    player.vy -= 25 * dt; // Normal Gravity\n                    if (keys.space && player.onGround) {\n                        player.vy = 8.5; // Jump\n                        player.onGround = false;\n                    }\n                }\n\n                // Apply Movement and Slide Collisions \n                player.x += player.vx * dt;\n                if (isColliding(player.x, player.y, player.z, player.radius, player.height)) {\n                    if (player.vx > 0) player.x = Math.floor(player.x + player.radius) - player.radius - 0.001;\n                    else player.x = Math.floor(player.x - player.radius) + 1 + player.radius + 0.001;\n                    player.vx = 0;\n                }\n\n                player.y += player.vy * dt;\n                player.onGround = false;\n                if (isColliding(player.x, player.y, player.z, player.radius, player.height)) {\n                    if (player.vy < 0) {\n                        player.y = Math.floor(player.y) + 1; // Landed\n                        player.onGround = true;\n                    } else {\n                        player.y = Math.floor(player.y + player.height) - player.height - 0.001; // Hit head\n                    }\n                    player.vy = 0;\n                }\n\n                player.z += player.vz * dt;\n                if (isColliding(player.x, player.y, player.z, player.radius, player.height)) {\n                    if (player.vz > 0) player.z = Math.floor(player.z + player.radius) - player.radius - 0.001;\n                    else player.z = Math.floor(player.z - player.radius) + 1 + player.radius + 0.001;\n                    player.vz = 0;\n                }\n\n                if (player.y < -10) {\n                    player.y = MAX_HEIGHT + 10;\n                    player.vy = 0;\n                }\n\n                // --- Enemy AI & Physics ---\n                if (gameActive) {\n                    let dx = player.x - enemy.x;\n                    let dz = player.z - enemy.z;\n                    let dist = Math.sqrt(dx*dx + dz*dz);\n                    \n                    // Update distance UI\n                    document.getElementById('distance-tracker').innerText = `Distance: ${Math.floor(dist)} blocks`;\n\n                    const enemyInWater = enemy.y < WATER_LEVEL + 0.8;\n                    const currentEnemySpeed = enemyInWater ? enemy.speed * 0.6 : enemy.speed; // Less hindered by water\n\n                    if (dist > 0) {\n                        enemy.vx = (dx / dist) * currentEnemySpeed;\n                        enemy.vz = (dz / dist) * currentEnemySpeed;\n                    }\n\n                    if (enemyInWater) {\n                        enemy.vy -= 8 * dt; // Buoyancy\n                        if (enemy.vy < -4) enemy.vy = -4;\n                        // Swim up if player is higher\n                        if (enemy.y < player.y) {\n                            enemy.vy += 15 * dt;\n                            if (enemy.vy > 4.5) enemy.vy = 4.5; // Enough to pop out to chase\n                        }\n                    } else {\n                        enemy.vy -= 25 * dt; // Gravity\n                    }\n\n                    // Enemy X\n                    enemy.x += enemy.vx * dt;\n                    if (isColliding(enemy.x, enemy.y, enemy.z, enemy.radius, enemy.height)) {\n                        enemy.x -= enemy.vx * dt; // Undo\n                        if (enemy.onGround && !enemyInWater) enemy.vy = 8.5; // Jump obstacle\n                        if (enemyInWater) enemy.vy = 5; // Swim over obstacle\n                    }\n\n                    // Enemy Y\n                    enemy.y += enemy.vy * dt;\n                    enemy.onGround = false;\n                    if (isColliding(enemy.x, enemy.y, enemy.z, enemy.radius, enemy.height)) {\n                        if (enemy.vy < 0) {\n                            enemy.y = Math.floor(enemy.y) + 1;\n                            enemy.onGround = true;\n                        } else {\n                            enemy.y = Math.floor(enemy.y + enemy.height) - enemy.height - 0.001;\n                        }\n                        enemy.vy = 0;\n                    }\n\n                    // Enemy Z\n                    enemy.z += enemy.vz * dt;\n                    if (isColliding(enemy.x, enemy.y, enemy.z, enemy.radius, enemy.height)) {\n                        enemy.z -= enemy.vz * dt; // Undo\n                        if (enemy.onGround && !enemyInWater) enemy.vy = 8.5; // Jump obstacle\n                        if (enemyInWater) enemy.vy = 5; // Swim over obstacle\n                    }\n\n                    if (enemy.y < -10) {\n                        enemy.y = MAX_HEIGHT + 10;\n                        enemy.vy = 0;\n                    }\n\n                    // Render Enemy\n                    enemy.mesh.position.set(enemy.x, enemy.y + enemy.height / 2, enemy.z);\n\n                    // Check Catch\n                    if (dist < (player.radius + enemy.radius + 0.4) && Math.abs(player.y - enemy.y) < 1.5) {\n                        gameOver();\n                    }\n                }\n            }\n\n            // Infinite water follows player\n            water.position.set(player.x, WATER_LEVEL + 0.8, player.z);\n\n            if (!isDead) {\n                // Camera is at eye level for normal 1st person gameplay\n                camera.position.set(player.x, player.y + player.height - 0.2, player.z);\n                \n                const targetX = camera.position.x + Math.sin(yaw) * Math.cos(pitch);\n                const targetY = camera.position.y + Math.sin(pitch);\n                const targetZ = camera.position.z + Math.cos(yaw) * Math.cos(pitch);\n                camera.lookAt(targetX, targetY, targetZ);\n            } else {\n                // Camera stares at the carnage during death animation\n                camera.lookAt(player.x, player.y + 0.5, player.z);\n            }\n\n            renderer.render(scene, camera);\n        }\n\n        // Handle Window Resize\n        window.addEventListener('resize', () => {\n            camera.aspect = window.innerWidth / window.innerHeight;\n            camera.updateProjectionMatrix();\n            renderer.setSize(window.innerWidth, window.innerHeight);\n        });\n\n        // Start Loop\n        animate();\n    <\/script>\n<\/body>\n<\/html>"};

        function showPage(pageId) {
            document.getElementById('home-view').style.display = 'none';
            const container = document.getElementById(pageId);
            container.style.display = 'block';
            
            // Dynamically inject the HTML to start the context
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = pageData[pageId];
            
            window.scrollTo(0, 0);
        }

        function goHome(pageId) {
            const container = document.getElementById(pageId);
            container.style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            
            // Wipe the iframe to destroy the WebGL context and free memory
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = '';
        }
