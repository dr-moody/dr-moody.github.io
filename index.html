    <script>
        // Safely injected JSON containing all the raw HTML files
        const pageData = {"page_0": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Hunger Games Simulator<\/title>\n    <style>\n        :root { \n            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #fbbf24; \n            --death: #dc2626; --injury: #fb923c; --special: #10b981; --social: #3b82f6; \n            --healthy: #c084fc; --fair: #22c55e;\n        }\n        * { box-sizing: border-box; }\n        body, html { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }\n\n        #reaping-phase { height: 100vh; width: 100vw; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }\n        textarea { width: 100%; max-width: 500px; height: 250px; background: var(--card); color: var(--text); border: 2px solid #334155; border-radius: 8px; padding: 15px; font-size: 1.1rem; margin-bottom: 20px; }\n        button { background: var(--bg); border: 2px solid var(--accent); color: var(--accent); padding: 15px 40px; font-size: 1.2rem; cursor: pointer; border-radius: 50px; transition: 0.3s; font-weight: bold; }\n        button:hover { background: var(--accent); color: var(--bg); }\n\n        #game-phase { display: none; position: relative; width: 100vw; height: 100vh; }\n        #log { width: 100%; height: 100%; position: relative; }\n\n        .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; display: flex; flex-direction: column; padding: 40px 20px; transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1); font-size: 1.8rem; text-align: center; line-height: 1.5; }\n        .scene.upcoming { transform: translateY(100vh); }\n        .scene.active { transform: translateY(0); }\n        .scene.past { transform: translateY(-100vh); }\n\n        .event-box { margin: auto; padding: 40px; border-radius: 12px; background: var(--card); border-top: 5px solid transparent; max-width: 800px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }\n        \n        .scene.header .event-box { border-top-color: var(--accent); font-size: 2.5rem; background: transparent; box-shadow: none; }\n        .scene.death .event-box { border-top-color: var(--death); background: #3f1616; }\n        .scene.injury .event-box { border-top-color: var(--injury); }\n        .scene.special .event-box { border-top-color: var(--special); }\n        .scene.social .event-box { border-top-color: var(--social); }\n        .scene.betrayal .event-box { border-top-color: var(--injury); background: rgba(251, 146, 60, 0.12); }\n        .scene.hunt .event-box { border-top-color: var(--social); background: rgba(59, 130, 246, 0.12); }\n        \n        .verbose-log { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #475569; font-family: monospace; font-size: 0.95rem; color: #94a3b8; text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; line-height: 1.4; }\n\n        .summary-box { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 40px; width: 100%; font-size: 1.2rem; text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }\n        .summary-section h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: 5px; font-variant: small-caps; letter-spacing: 1px; }\n        .summary-list { list-style: none; padding: 0; margin: 0; font-size: 1.1rem; }\n        .summary-list li { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 4px;}\n        .summary-list li:last-child { border-bottom: none; }\n        \n        .row-header { display: flex; justify-content: space-between; align-items: baseline; }\n        .alliance-tag { font-size: 0.85rem; color: var(--social); font-weight: bold; background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px; align-self: flex-start; margin-top: 5px;}\n        .verbose-stats { font-family: monospace; font-size: 0.85rem; color: #64748b; margin-top: 4px; }\n        \n        .hp-healthy { color: var(--healthy); font-weight: bold; }\n        .hp-fair { color: var(--fair); font-weight: bold; }\n        .hp-weak { color: #facc15; font-weight: bold; }\n        .hp-critical { color: var(--death); font-weight: bold; }\n        .hp-injured { color: var(--injury); font-size: 0.9rem; font-style: italic; margin-left: 5px; }\n\n        .full-width { grid-column: 1 / -1; }\n        \n        .dead-info { font-size: 0.95rem; color: #94a3b8; text-align: right; }\n    <\/style>\n<\/head>\n<body>\n\n<div id=\"app\">\n    <div id=\"reaping-phase\">\n        <h1 style=\"color: var(--accent); font-size: 3rem; margin-bottom: 10px;\">The Reaping<\/h1>\n        <textarea id=\"nameInput\" placeholder=\"Katniss Everdeen&#10;Peeta Mellark&#10;Cato...\"><\/textarea>\n        <button onclick=\"setupGame()\">Commence Simulation<\/button>\n    <\/div>\n    <div id=\"game-phase\"><div id=\"log\"><\/div><\/div>\n<\/div>\n\n<script>\nfunction randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }\nfunction pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }\n\nfunction formatNames(arr) {\n    if (arr.length === 0) return \"\";\n    if (arr.length === 1) return `<strong>${arr[0]}<\/strong>`;\n    if (arr.length === 2) return `<strong>${arr[0]}<\/strong> and <strong>${arr[1]}<\/strong>`;\n    const wrapped = arr.map(n => `<strong>${n}<\/strong>`);\n    return wrapped.slice(0, -1).join(', ') + ', and ' + wrapped[wrapped.length - 1];\n}\n\nfunction formatPlainNames(arr) {\n    if (arr.length === 0) return \"none\";\n    if (arr.length === 1) return arr[0];\n    if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;\n    return arr.slice(0, -1).join(', ') + ', and ' + arr[arr.length - 1];\n}\n\nlet isAnimating = false;\nfunction nextSlide() {\n    if (isAnimating || !game || game.currentSlideIndex >= game.slides.length - 1) return;\n    isAnimating = true;\n    game.slides[game.currentSlideIndex].classList.replace('active', 'past');\n    game.slides[game.currentSlideIndex + 1].classList.replace('upcoming', 'active');\n    game.currentSlideIndex++;\n    setTimeout(() => isAnimating = false, 800); \n}\nfunction prevSlide() {\n    if (isAnimating || !game || game.currentSlideIndex <= 0) return;\n    isAnimating = true;\n    game.slides[game.currentSlideIndex].classList.replace('active', 'upcoming');\n    game.slides[game.currentSlideIndex - 1].classList.replace('past', 'active');\n    game.currentSlideIndex--;\n    setTimeout(() => isAnimating = false, 800);\n}\n\nwindow.addEventListener('keydown', (e) => {\n    if (document.getElementById('game-phase').style.display !== 'block') return;\n    if (['ArrowDown', 'ArrowRight', ' ', 'PageDown'].includes(e.key)) nextSlide();\n    else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) prevSlide();\n});\n\nwindow.addEventListener('wheel', (e) => {\n    if (document.getElementById('game-phase').style.display !== 'block') return;\n    const scene = game.slides[game.currentSlideIndex];\n    if (!scene) return;\n    \n    const isScrollable = scene.scrollHeight > scene.clientHeight;\n    \n    if (isScrollable) {\n        const atTop = scene.scrollTop <= 1;\n        const atBottom = Math.ceil(scene.scrollTop) + scene.clientHeight >= scene.scrollHeight - 1;\n        \n        if (e.deltaY > 0 && !atBottom) return; \n        if (e.deltaY < 0 && !atTop) return;    \n    }\n\n    if (e.deltaY > 0) nextSlide();\n    else if (e.deltaY < 0) prevSlide();\n}, { passive: true });\n\nconst TEXT_TRUST_UP_DUO = [`hold hands while watching the sky.`, `flirt awkwardly while sharing a meager meal.`, `take turns crying on each other's shoulders about home.`, `braid each other's hair.`, `watch over each other while the other sleeps.`, `comfort each other through a difficult night.`];\nconst TEXT_TRUST_UP_GROUP = [`talk about what they miss most from their districts.`, `play a makeshift game to pass the time.`, `share stories of their families around a hidden fire.`, `take turns keeping watch while the others sleep.`];\nconst TEXT_TRUST_DOWN_DUO = [`argue over dwindling supplies until tempers flare.`, `trade sharp accusations and avoid eye contact for the rest of the night.`, `dispute who should lead and end the encounter in silence.`, `nearly come to blows after a bitter disagreement.`];\nconst TEXT_TRUST_DOWN_GROUP = [`fall into a heated argument that fractures the group.`, `split into tense camps after accusing each other of selfishness.`, `struggle to cooperate as distrust poisons the conversation.`, `turn on one another after a chaotic dispute over strategy.`];\nconst TEXT_BETRAYAL_EVENTS = [`{group} trade accusations and old loyalties crack.`, `Distrust erupts among {group}, and alliances start to splinter.`, `{broken} turn on each other, shattering the alliance in plain sight.`, `{group} descend into paranoia, and trusted bonds collapse.`];\nconst TEXT_ALLIANCE_HUNT = [`{hunters} organize a coordinated hunt against {targets}.`, `{hunters} track down {targets} as a united alliance strike team.`, `{hunters} move as one and ambush {targets}.`, `Acting together, {hunters} launch a targeted assault on {targets}.`];\n\nclass Tribute {\n    constructor(name) {\n        this.name = name; this.isAlive = true;\n        this.hp = 100; this.maxHp = 150;\n        this.weapons = 0; this.kills = 0;\n        this.trust = {}; this.hasBrokenLeg = false;\n        this.allies = new Set();\n        this.deathPhase = null; this.killedBy = null; this.deathOrder = null;\n    }\n    calculatePower() {\n        let p = 10 + (this.weapons * 15); p *= (this.hp / 100); \n        if (this.hasBrokenLeg) p *= 0.6;\n        return Math.max(p, 1);\n    }\n    getHealthHTML() {\n        if (!this.isAlive) return `<span style=\"color:var(--death)\">Deceased<\/span>`;\n        let label = \"\", css = \"\";\n        if (this.hp > 100) { label = \"Healthy\"; css = \"hp-healthy\"; }\n        else if (this.hp > 70) { label = \"Fair\"; css = \"hp-fair\"; }\n        else if (this.hp > 30) { label = \"Weak\"; css = \"hp-weak\"; }\n        else { label = \"Critical\"; css = \"hp-critical\"; }\n        let injury = this.hasBrokenLeg ? `<span class=\"hp-injured\">Injured<\/span>` : \"\";\n        return `<span class=\"${css}\">${label}<\/span>${injury}`;\n    }\n}\n\nclass Engine {\n    constructor(names, isVerbose) {\n        this.tributes = names.map(n => new Tribute(n.trim())).filter(t => t.name.length > 0);\n        this.isVerbose = isVerbose; this.day = 1; this.isNight = false;\n        this.deathCounter = 0; this.deathsThisPhase = []; this.slides = []; this.currentSlideIndex = 0;\n        this.phasesSinceDeath = 0;\n        this.trustThresholds = {\n            accept: 10,\n            genuine: 25,\n            high: 40\n        };\n        this.falseAcceptChance = 0.40;\n        \n        for (let i = 0; i < this.tributes.length; i++) {\n            for (let j = i + 1; j < this.tributes.length; j++) {\n                const tA = this.tributes[i], tB = this.tributes[j];\n                tA.trust[tB.name] = this.generateInitialTrust();\n                tB.trust[tA.name] = this.generateInitialTrust();\n            }\n        }\n    }\n\n    generateInitialTrust() {\n        const r = Math.random();\n        if (r < 0.60) return randInt(-20, 8);\n        if (r < 0.90) return randInt(9, 28);\n        return randInt(29, 55);\n    }\n\n    getTrust(from, to) {\n        return from.trust[to.name] ?? 0;\n    }\n\n    adjustTrust(from, to, delta) {\n        const next = this.getTrust(from, to) + delta;\n        from.trust[to.name] = Math.max(-40, Math.min(100, next));\n    }\n\n    addAlliance(a, b) {\n        a.allies.add(b.name);\n        b.allies.add(a.name);\n    }\n\n    removeAlliance(a, b) {\n        a.allies.delete(b.name);\n        b.allies.delete(a.name);\n    }\n\n    getPairKey(a, b) {\n        return [a.name, b.name].sort().join('::');\n    }\n\n    getTributeByName(name) {\n        return this.tributes.find(t => t.name === name);\n    }\n\n    getAllianceComponentByName(name) {\n        const start = this.getTributeByName(name);\n        if (!start) return new Set();\n\n        const visited = new Set();\n        const queue = [start.name];\n\n        while (queue.length > 0) {\n            const currentName = queue.shift();\n            if (visited.has(currentName)) continue;\n            visited.add(currentName);\n\n            const current = this.getTributeByName(currentName);\n            if (!current) continue;\n            current.allies.forEach(allyName => {\n                if (!visited.has(allyName)) queue.push(allyName);\n            });\n        }\n\n        return visited;\n    }\n\n    mergeAllianceClusters(a, b) {\n        const mergedNames = new Set([\n            ...this.getAllianceComponentByName(a.name),\n            ...this.getAllianceComponentByName(b.name),\n            a.name,\n            b.name\n        ]);\n\n        const members = Array.from(mergedNames)\n            .map(name => this.getTributeByName(name))\n            .filter(Boolean);\n\n        for (let i = 0; i < members.length; i++) {\n            for (let j = i + 1; j < members.length; j++) {\n                members[i].allies.add(members[j].name);\n                members[j].allies.add(members[i].name);\n            }\n        }\n    }\n\n    getLargestAllianceSubgroup(group) {\n        const groupNameSet = new Set(group.map(t => t.name));\n        const visited = new Set();\n        let best = [];\n\n        group.forEach(start => {\n            if (visited.has(start.name)) return;\n\n            const stack = [start.name];\n            const componentNames = [];\n\n            while (stack.length > 0) {\n                const name = stack.pop();\n                if (visited.has(name)) continue;\n                visited.add(name);\n                componentNames.push(name);\n\n                const tribute = this.getTributeByName(name);\n                if (!tribute) continue;\n\n                tribute.allies.forEach(allyName => {\n                    if (groupNameSet.has(allyName) && !visited.has(allyName)) stack.push(allyName);\n                });\n            }\n\n            if (componentNames.length > best.length) best = componentNames;\n        });\n\n        return best.map(name => this.getTributeByName(name)).filter(Boolean);\n    }\n\n    planAllianceHunt(group, unacted, logs) {\n        const hunters = this.getLargestAllianceSubgroup(group);\n        if (hunters.length < 2) return null;\n\n        const baseHuntChance = Math.min(0.92, 0.68 + ((hunters.length - 2) * 0.08));\n        if (Math.random() > baseHuntChance) return null;\n\n        const hunterNameSet = new Set(hunters.map(t => t.name));\n        const targetPool = unacted.filter(t => t.isAlive && !hunterNameSet.has(t.name));\n        if (targetPool.length === 0) return null;\n\n        const weightedTargets = targetPool.map(t => {\n            const avgTrust = hunters.reduce((s, h) => s + this.getTrust(h, t), 0) / hunters.length;\n            const allianceSize = this.getAllianceComponentByName(t.name).size;\n            const alliedWithHunters = hunters.some(h => h.allies.has(t.name));\n            let w = 30;\n            w += allianceSize > 1 ? 55 + (allianceSize * 12) : 15;\n            w += Math.max(0, 25 - avgTrust);\n            if (alliedWithHunters) w = 1;\n            return { t, weight: Math.max(1, w) };\n        });\n\n        let targetCount = 1;\n        if (hunters.length >= 3 && weightedTargets.length > 1 && Math.random() < 0.55) targetCount = 2;\n        if (hunters.length >= 5 && weightedTargets.length > 2 && Math.random() < 0.35) targetCount = 3;\n\n        const selected = [];\n        let pool = [...weightedTargets];\n        while (selected.length < targetCount && pool.length > 0) {\n            const total = pool.reduce((s, i) => s + i.weight, 0);\n            let roll = Math.random() * total;\n            const picked = pool.find(i => (roll -= i.weight) <= 0);\n            if (!picked) break;\n            selected.push(picked.t);\n            pool = pool.filter(i => i.t.name !== picked.t.name);\n        }\n\n        if (selected.length === 0) return null;\n        logs.push(`Alliance hunt intent selected: ${hunters.map(t => t.name).join(', ')} -> ${selected.map(t => t.name).join(', ')}.`);\n        return { hunters, targets: selected };\n    }\n\n    getGenuineAcceptanceChance(recipientTrust) {\n        const clamped = Math.max(this.trustThresholds.accept, Math.min(70, recipientTrust));\n        const span = 70 - this.trustThresholds.accept;\n        const pct = (clamped - this.trustThresholds.accept) / span;\n        return 0.35 + (pct * 0.50);\n    }\n\n    maybeFormAlliance(tA, tB, logs) {\n        if (tA.allies.has(tB.name) || tB.allies.has(tA.name)) {\n            return { offered: false, formed: false, joinedNames: [], declinedNames: [] };\n        }\n\n        const trustAB = this.getTrust(tA, tB);\n        const trustBA = this.getTrust(tB, tA);\n\n        if (trustAB >= this.trustThresholds.high && trustBA >= this.trustThresholds.high) {\n            if (Math.random() < 0.90) {\n                this.mergeAllianceClusters(tA, tB);\n                logs.push(`++ Alliance formed between ${tA.name} and ${tB.name} (mutual high trust).`);\n                return { offered: true, formed: true, joinedNames: [tA.name, tB.name], declinedNames: [] };\n            }\n            return { offered: true, formed: false, joinedNames: [], declinedNames: [tA.name, tB.name] };\n        }\n\n        let initiator = null;\n        let recipient = null;\n        if (trustAB >= this.trustThresholds.genuine && trustAB >= trustBA) {\n            initiator = tA;\n            recipient = tB;\n        } else if (trustBA >= this.trustThresholds.genuine) {\n            initiator = tB;\n            recipient = tA;\n        } else {\n            return { offered: false, formed: false, joinedNames: [], declinedNames: [] };\n        }\n\n        const initiatorTrust = this.getTrust(initiator, recipient);\n        const recipientTrust = this.getTrust(recipient, initiator);\n\n        if (recipientTrust >= this.trustThresholds.accept) {\n            const acceptChance = this.getGenuineAcceptanceChance(recipientTrust);\n            if (Math.random() < acceptChance) {\n                this.mergeAllianceClusters(initiator, recipient);\n                logs.push(`++ Alliance formed between ${initiator.name} and ${recipient.name}.`);\n                return { offered: true, formed: true, joinedNames: [initiator.name, recipient.name], declinedNames: [] };\n            }\n            logs.push(`-- ${recipient.name} rejected a genuine alliance offer from ${initiator.name}.`);\n            return { offered: true, formed: false, joinedNames: [], declinedNames: [recipient.name] };\n        }\n\n        if (initiatorTrust >= this.trustThresholds.genuine) {\n            if (Math.random() < this.falseAcceptChance) {\n                this.mergeAllianceClusters(initiator, recipient);\n                logs.push(`++ Alliance formed between ${initiator.name} and ${recipient.name}.`);\n                logs.push(`!! Internal state: false-trust alliance accepted.`);\n                return { offered: true, formed: true, joinedNames: [initiator.name, recipient.name], declinedNames: [] };\n            }\n            logs.push(`-- ${recipient.name} refused a one-sided alliance push from ${initiator.name}.`);\n            return { offered: true, formed: false, joinedNames: [], declinedNames: [recipient.name] };\n        }\n\n        return { offered: false, formed: false, joinedNames: [], declinedNames: [] };\n    }\n\n    getBreakChanceByTrust(minTrust) {\n        if (minTrust >= 25) return 0.18;\n        if (minTrust >= 10) return 0.34;\n        if (minTrust >= 0) return 0.56;\n        return 0.82;\n    }\n\n    runBetrayalPass(group, logs, protectedPairKeys = new Set()) {\n        let brokenPairs = [];\n\n        for (let i = 0; i < group.length; i++) {\n            for (let j = i + 1; j < group.length; j++) {\n                const tA = group[i], tB = group[j];\n                if (!tA.allies.has(tB.name) || !tB.allies.has(tA.name)) continue;\n\n                const pairKey = this.getPairKey(tA, tB);\n                if (protectedPairKeys.has(pairKey)) continue;\n\n                const trustAB = this.getTrust(tA, tB);\n                const trustBA = this.getTrust(tB, tA);\n                const minTrust = Math.min(trustAB, trustBA);\n                const asymmetry = Math.abs(trustAB - trustBA);\n                const breakChance = Math.min(0.95, this.getBreakChanceByTrust(minTrust) + (asymmetry / 160));\n\n                if (Math.random() < breakChance) {\n                    this.removeAlliance(tA, tB);\n                    this.adjustTrust(tA, tB, -randInt(8, 16));\n                    this.adjustTrust(tB, tA, -randInt(8, 16));\n                    brokenPairs.push({ a: tA, b: tB, trustAB, trustBA, asymmetry });\n                    logs.push(`!! Alliance broken: ${tA.name} and ${tB.name} (chance ${Math.round(breakChance * 100)}%).`);\n                }\n            }\n        }\n\n        if (brokenPairs.length === 0) return { brokenPairs, escalateToCombat: false };\n\n        const severity = brokenPairs.reduce((sum, p) => {\n            const hostility = Math.max(0, -Math.min(p.trustAB, p.trustBA));\n            return sum + hostility + (p.asymmetry / 2);\n        }, 0);\n\n        const escalationChance = Math.min(0.98, 0.35 + Math.min(0.45, severity / 140));\n        const escalateToCombat = Math.random() < escalationChance;\n        logs.push(`Betrayal escalation check: ${Math.round(escalationChance * 100)}% -> ${escalateToCombat ? 'COMBAT' : 'No combat'}.`);\n\n        return { brokenPairs, escalateToCombat };\n    }\n\n    buildInteractionGroup(t1, unacted, logs) {\n        let group = [t1];\n        if (unacted.length === 0) return group;\n\n        let pwr = t1.calculatePower();\n        let huntBonus = (pwr / 10) * 15;\n        if (pwr > 80) huntBonus *= 2.5;\n\n        logs.push(`Hunting calculation: Base pull weight generated at +${huntBonus.toFixed(1)}`);\n        let pool = [{ type: 'solo', weight: 16 }];\n\n        const alliedCandidates = unacted.filter(t2 => t1.allies.has(t2.name));\n        if (alliedCandidates.length > 0 && Math.random() < 0.80) {\n            const allyPool = alliedCandidates.map(t2 => {\n                const w = Math.max(1, 150 + huntBonus + (this.getTrust(t1, t2) * 2.4));\n                return { t: t2, weight: w };\n            });\n            let allyTotal = allyPool.reduce((s, i) => s + i.weight, 0);\n            let allyRoll = Math.random() * allyTotal;\n            let allySelected = allyPool.find(i => (allyRoll -= i.weight) <= 0);\n            if (allySelected) {\n                logs.push(`Alliance pull activated (80%): ${t1.name} grouped with ally ${allySelected.t.name}.`);\n                group.push(allySelected.t);\n                unacted = unacted.filter(t => t.name !== allySelected.t.name);\n            }\n        }\n\n        if (group.length > 1) {\n            while (unacted.length > 0 && group.length < 8) {\n                const size = group.length;\n                let baseChance = 0.10;\n                if (size === 2) baseChance = 0.34;\n                else if (size === 3) baseChance = 0.26;\n                else if (size === 4) baseChance = 0.18;\n\n                let bestAllyLinks = 0;\n                unacted.forEach(candidate => {\n                    const allyLinks = group.reduce((s, member) => s + (candidate.allies.has(member.name) ? 1 : 0), 0);\n                    if (allyLinks > bestAllyLinks) bestAllyLinks = allyLinks;\n                });\n\n                let addChance = baseChance;\n                if (bestAllyLinks > 0) {\n                    addChance += 0.32;\n                    addChance += Math.min(0.44, bestAllyLinks * 0.12);\n                }\n                addChance = Math.max(0.03, Math.min(0.90, addChance));\n\n                if (Math.random() > addChance) break;\n\n                const candidatePool = unacted.map(candidate => {\n                    const avgTrust = group.reduce((s, member) => s + this.getTrust(candidate, member), 0) / group.length;\n                    const allyLinks = group.reduce((s, member) => s + (candidate.allies.has(member.name) ? 1 : 0), 0);\n                    let w = 8 + Math.max(0, avgTrust * 1.2) + (candidate.calculatePower() / 4);\n                    if (allyLinks > 0) w += 220 * allyLinks;\n                    return { candidate, weight: Math.max(1, w) };\n                });\n\n                let expandTotal = candidatePool.reduce((s, i) => s + i.weight, 0);\n                let expandRoll = Math.random() * expandTotal;\n                let picked = candidatePool.find(i => (expandRoll -= i.weight) <= 0);\n                if (!picked) break;\n\n                group.push(picked.candidate);\n                logs.push(`RNG expanded interaction group with ${picked.candidate.name} (size now ${group.length}).`);\n                unacted = unacted.filter(t => t.name !== picked.candidate.name);\n            }\n\n            return group;\n        }\n\n        unacted.forEach(t2 => {\n            let w = 10 + huntBonus;\n            if (t1.allies.has(t2.name)) w += 320;\n            w += (this.getTrust(t1, t2) * 2);\n            pool.push({ type: 'tribute', t: t2, weight: Math.max(1, w) });\n            logs.push(`>> Weight check -> ${t2.name}: ${Math.max(1, w).toFixed(1)}`);\n        });\n\n        let totalWeight = pool.reduce((s, i) => s + i.weight, 0);\n        let roll = Math.random() * totalWeight;\n        let selected = pool.find(i => (roll -= i.weight) <= 0);\n\n        if (!(selected && selected.type === 'tribute')) {\n            logs.push(`RNG selected solo event.`);\n            return group;\n        }\n\n        logs.push(`RNG selected interaction with ${selected.t.name}`);\n        group.push(selected.t);\n        unacted = unacted.filter(t => t.name !== selected.t.name);\n\n        while (unacted.length > 0 && group.length < 8) {\n            const size = group.length;\n            let baseChance = 0.10;\n            if (size === 2) baseChance = 0.30;\n            else if (size === 3) baseChance = 0.23;\n            else if (size === 4) baseChance = 0.16;\n\n            let bestAllyLinks = 0;\n            unacted.forEach(candidate => {\n                const allyLinks = group.reduce((s, member) => s + (candidate.allies.has(member.name) ? 1 : 0), 0);\n                if (allyLinks > bestAllyLinks) bestAllyLinks = allyLinks;\n            });\n\n            let addChance = baseChance;\n            if (bestAllyLinks > 0) {\n                addChance += 0.30;\n                addChance += Math.min(0.40, bestAllyLinks * 0.12);\n            }\n            addChance = Math.max(0.03, Math.min(0.90, addChance));\n\n            if (Math.random() > addChance) break;\n\n            const candidatePool = unacted.map(candidate => {\n                const avgTrust = group.reduce((s, member) => s + this.getTrust(candidate, member), 0) / group.length;\n                const allyLinks = group.reduce((s, member) => s + (candidate.allies.has(member.name) ? 1 : 0), 0);\n                let w = 8 + Math.max(0, avgTrust * 1.2) + (candidate.calculatePower() / 4);\n                if (allyLinks > 0) w += 180 * allyLinks;\n                return { candidate, weight: Math.max(1, w) };\n            });\n\n            let expandTotal = candidatePool.reduce((s, i) => s + i.weight, 0);\n            let expandRoll = Math.random() * expandTotal;\n            let picked = candidatePool.find(i => (expandRoll -= i.weight) <= 0);\n            if (!picked) break;\n\n            group.push(picked.candidate);\n            logs.push(`RNG expanded interaction group with ${picked.candidate.name} (size now ${group.length}).`);\n            unacted = unacted.filter(t => t.name !== picked.candidate.name);\n        }\n\n        return group;\n    }\n\n    getPhaseName() { return this.isNight ? `Night ${this.day}` : `Day ${this.day}`; }\n\n    createSlide(content, styleClass = \"neutral\", logs = []) {\n        const scene = document.createElement('div');\n        scene.className = `scene ${styleClass}`;\n        let html = `<div class=\"event-box\">${content}`;\n        if (this.isVerbose && logs.length > 0) html += `<div class=\"verbose-log\"><strong>[System Core]<\/strong><br>> ${logs.join('<br>> ')}<\/div>`;\n        html += `<\/div>`;\n        scene.innerHTML = html;\n        this.slides.push(scene);\n    }\n\n    playRound() {\n        this.slides = []; this.currentSlideIndex = 0; document.getElementById('log').innerHTML = '';\n        this.deathsThisPhase = []; \n        let living = this.tributes.filter(t => t.isAlive);\n        \n        if (living.length <= 1) { \n            this.handleEndGame(living[0]); \n            return; \n        }\n\n        this.createSlide(`<h1>${this.getPhaseName()}<\/h1>`, \"header\");\n        \n        if (this.phasesSinceDeath >= 3) {\n            this.triggerArenaEvent(living);\n            this.phasesSinceDeath = 0;\n        } else {\n            this.processPhase(living);\n        }\n\n        if (this.deathsThisPhase.length > 0) this.phasesSinceDeath = 0;\n        else this.phasesSinceDeath++;\n\n        this.generateSummaryScreen();\n        this.renderSlides();\n\n        if (this.isNight) { this.isNight = false; this.day++; } else { this.isNight = true; }\n    }\n\n    renderSlides() {\n        this.slides.forEach((slide, idx) => {\n            slide.classList.add(idx === 0 ? 'active' : 'upcoming');\n            document.getElementById('log').appendChild(slide);\n        });\n    }\n\n    triggerArenaEvent(living) {\n        let logs = [];\n        logs.push(`No deaths detected for 3 consecutive phases. System overriding to force interaction.`);\n        const events = [\n            { name: \"Fireballs\", text: \"The Gamemakers launch fireballs into the arena to drive tributes together!\" },\n            { name: \"Acid Fog\", text: \"A thick, caustic fog rolls across the landscape, burning those caught in it!\" },\n            { name: \"Wolf Mutts\", text: \"A pack of genetically enhanced wolf mutts is released into the arena!\" }\n        ];\n        const evt = pickRandom(events);\n        this.createSlide(`<h2 style=\"color:var(--death)\">ARENA EVENT: ${evt.name}<\/h2><p>${evt.text}<\/p>`, \"death\", logs);\n\n        let factions = living.map(t => [t]);\n        let combatLogs = [`Executing multi-faction clash triggered by Arena Event.`];\n        this.executeCombat(factions, combatLogs, true); \n    }\n\n    processPhase(living) {\n        let unacted = [...living].sort(() => Math.random() - 0.5);\n        while (unacted.length > 0) {\n            let t1 = unacted.shift();\n            if (!t1 || !t1.isAlive) continue;\n            let logs = [];\n            logs.push(`Processing phase for: ${t1.name} (HP: ${t1.hp}, Pwr: ${t1.calculatePower().toFixed(1)})`);\n            let group = this.buildInteractionGroup(t1, unacted, logs);\n\n            const huntPlan = this.planAllianceHunt(group, unacted, logs);\n            if (huntPlan) {\n                huntPlan.targets.forEach(target => {\n                    if (!group.find(t => t.name === target.name)) group.push(target);\n                });\n            }\n\n            const groupedNames = new Set(group.map(t => t.name));\n            unacted = unacted.filter(t => !groupedNames.has(t.name));\n\n            if (huntPlan) {\n                const huntText = pickRandom(TEXT_ALLIANCE_HUNT)\n                    .replace('{hunters}', formatNames(huntPlan.hunters.map(t => t.name)))\n                    .replace('{targets}', formatNames(huntPlan.targets.map(t => t.name)));\n                this.executeCombat([huntPlan.hunters, huntPlan.targets], logs, false, huntText, \"hunt\");\n                continue;\n            }\n\n            if (group.length === 1) this.handleSolo(group[0], logs);\n            else this.handleGroup(group, logs);\n        }\n    }\n\n    handleGroup(group, logs) {\n        let factions = [[group[0]]];\n        logs.push(`Group formed: [${group.map(t=>t.name).join(', ')}]`);\n        for (let i = 1; i < group.length; i++) {\n            let t = group[i], bestA = -999, bestF = -1;\n            factions.forEach((f, idx) => {\n                let a = f.reduce((s, m) => s + (t.allies.has(m.name) ? 50 : this.getTrust(t, m)), 0);\n                if (a > bestA) { bestA = a; bestF = idx; }\n            });\n            if (Math.random() < 0.6) factions[bestF].push(t); else factions.push([t]);\n        }\n\n        if (factions.length === 1) {\n            logs.push(`Faction check resulted in peace.`);\n            \n            const joinedAllianceMembers = new Set();\n            const declinedAllianceMembers = new Set();\n            let allianceOffersAttempted = 0;\n            let trustUpPairs = 0;\n            let trustDownPairs = 0;\n            const formedAllianceKeys = new Set();\n            for (let i = 0; i < group.length; i++) {\n                for (let j = i + 1; j < group.length; j++) {\n                    let tA = group[i], tB = group[j];\n                    const trustABBefore = this.getTrust(tA, tB);\n                    const trustBABefore = this.getTrust(tB, tA);\n                    const sharedAlliance = tA.allies.has(tB.name) && tB.allies.has(tA.name);\n                    const avgTrust = (trustABBefore + trustBABefore) / 2;\n\n                    let pairMood = 'up';\n                    if (sharedAlliance || avgTrust >= 12) {\n                        this.adjustTrust(tA, tB, randInt(2, 8));\n                        this.adjustTrust(tB, tA, randInt(2, 8));\n                        trustUpPairs++;\n                    } else if (avgTrust <= 0 || Math.random() < 0.40) {\n                        this.adjustTrust(tA, tB, -randInt(2, 7));\n                        this.adjustTrust(tB, tA, -randInt(2, 7));\n                        trustDownPairs++;\n                        pairMood = 'down';\n                    } else {\n                        this.adjustTrust(tA, tB, randInt(1, 5));\n                        this.adjustTrust(tB, tA, randInt(1, 5));\n                        trustUpPairs++;\n                    }\n\n                    if (pairMood === 'up') {\n                        const allianceResult = this.maybeFormAlliance(tA, tB, logs);\n                        if (allianceResult.offered) allianceOffersAttempted++;\n                        if (allianceResult.formed) {\n                            allianceResult.joinedNames.forEach(name => joinedAllianceMembers.add(name));\n                            formedAllianceKeys.add(this.getPairKey(tA, tB));\n                        }\n                        allianceResult.declinedNames.forEach(name => declinedAllianceMembers.add(name));\n                    }\n                }\n            }\n\n            joinedAllianceMembers.forEach(name => {\n                if (declinedAllianceMembers.has(name)) declinedAllianceMembers.delete(name);\n            });\n\n            const betrayalOutcome = this.runBetrayalPass(group, logs, formedAllianceKeys);\n            if (betrayalOutcome.escalateToCombat) {\n                logs.push(`Peace collapsed due to betrayal. Escalating to combat.`);\n                const brokenNames = Array.from(new Set(betrayalOutcome.brokenPairs.flatMap(p => [p.a.name, p.b.name])));\n                const betrayalLead = pickRandom(TEXT_BETRAYAL_EVENTS)\n                    .replace('{group}', formatNames(group.map(t => t.name)))\n                    .replace('{broken}', formatNames(brokenNames));\n                let conflictFactions = [];\n                group.forEach(t => {\n                    let placed = false;\n                    for (let i = 0; i < conflictFactions.length; i++) {\n                        const faction = conflictFactions[i];\n                        const fits = faction.every(m => t.allies.has(m.name) && m.allies.has(t.name));\n                        if (fits) {\n                            faction.push(t);\n                            placed = true;\n                            break;\n                        }\n                    }\n                    if (!placed) conflictFactions.push([t]);\n                });\n\n                if (conflictFactions.length < 2) {\n                    const pivot = conflictFactions[0][0];\n                    const weakest = group\n                        .filter(t => t.name !== pivot.name)\n                        .sort((a, b) => this.getTrust(a, pivot) - this.getTrust(b, pivot))[0];\n                    if (weakest) {\n                        conflictFactions = [[pivot], [weakest]];\n                        group.filter(t => t.name !== pivot.name && t.name !== weakest.name).forEach(t => {\n                            if (this.getTrust(t, pivot) >= this.getTrust(t, weakest)) conflictFactions[0].push(t);\n                            else conflictFactions[1].push(t);\n                        });\n                    }\n                }\n\n                this.executeCombat(conflictFactions, logs, false, betrayalLead, \"betrayal\");\n                return;\n            }\n\n            let namesRaw = group.map(t => t.name);\n            let slideText;\n            if (betrayalOutcome.brokenPairs.length > 0) {\n                const brokenNames = Array.from(new Set(betrayalOutcome.brokenPairs.flatMap(p => [p.a.name, p.b.name])));\n                slideText = pickRandom(TEXT_BETRAYAL_EVENTS)\n                    .replace('{group}', formatNames(namesRaw))\n                    .replace('{broken}', formatNames(brokenNames));\n            } else if (trustDownPairs > trustUpPairs) {\n                slideText = `${formatNames(namesRaw)} ${group.length === 2 ? pickRandom(TEXT_TRUST_DOWN_DUO) : pickRandom(TEXT_TRUST_DOWN_GROUP)}`;\n            } else {\n                slideText = `${formatNames(namesRaw)} ${group.length === 2 ? pickRandom(TEXT_TRUST_UP_DUO) : pickRandom(TEXT_TRUST_UP_GROUP)}`;\n            }\n            \n            if (group.length > 2 && allianceOffersAttempted > 0) {\n                const groupMemberNames = group.map(t => t.name);\n                const joinedNamesOrdered = groupMemberNames.filter(name => joinedAllianceMembers.has(name));\n                if (joinedNamesOrdered.length > 0) {\n                    const declinedNamesOrdered = groupMemberNames.filter(name => !joinedAllianceMembers.has(name));\n                    const joinedSentence = `${formatPlainNames(joinedNamesOrdered)} formed an alliance.`;\n                    const declinedSentence = `${formatPlainNames(declinedNamesOrdered)} declined the alliance offer.`;\n                    slideText += `<br><br><span style=\"color:var(--special); font-size: 0.85em;\">${joinedSentence}<\/span>`;\n                    slideText += `<br><span style=\"color:var(--injury); font-size: 0.85em;\">${declinedSentence}<\/span>`;\n\n                    const touchedAlliance = new Set();\n                    joinedNamesOrdered.forEach(name => this.getAllianceComponentByName(name).forEach(member => touchedAlliance.add(member)));\n                    if (touchedAlliance.size > joinedNamesOrdered.length) {\n                        slideText += `<br><span style=\"color:var(--social); font-size: 0.85em;\">Their alliance now includes ${formatPlainNames(Array.from(touchedAlliance))}.<\/span>`;\n                    }\n                }\n            } else if (joinedAllianceMembers.size > 0) {\n                slideText += `<br><br><span style=\"color:var(--special); font-size: 0.85em;\">An alliance was formed by ${formatPlainNames(Array.from(joinedAllianceMembers))}.<\/span>`;\n                if (declinedAllianceMembers.size > 0) {\n                    slideText += `<br><span style=\"color:var(--injury); font-size: 0.85em;\">An alliance offer was declined by ${formatPlainNames(Array.from(declinedAllianceMembers))}.<\/span>`;\n                }\n\n                const touchedAlliance = new Set();\n                Array.from(joinedAllianceMembers).forEach(name => this.getAllianceComponentByName(name).forEach(member => touchedAlliance.add(member)));\n                if (touchedAlliance.size > joinedAllianceMembers.size) {\n                    slideText += `<br><span style=\"color:var(--social); font-size: 0.85em;\">Their alliance now includes ${formatPlainNames(Array.from(touchedAlliance))}.<\/span>`;\n                }\n            }\n\n            this.createSlide(slideText, \"social\", logs);\n        } else {\n            logs.push(`Faction alignment failed. Escalating to combat.`);\n            this.executeCombat(factions, logs);\n        }\n    }\n\n    executeCombat(factions, logs, isArenaEvent = false, prefaceText = \"\", noDeathStyleClass = \"injury\") {\n        let dead = [];\n        logs.push(`Initiating Combat Routine.`);\n        \n        // 70% Lethal Override Logic Roll\n        let triggerLethalOverride = Math.random() < 0.70;\n        logs.push(`Lethal Override System Check: ${triggerLethalOverride ? \"ACTIVE (70% Hit)\" : \"INACTIVE (30% Miss)\"}`);\n\n        let rolls = factions.map(f => {\n            let pwr = f.reduce((s, t) => s + t.calculatePower(), 0);\n            let rng = (0.5 + Math.random());\n            let roll = pwr * rng;\n            logs.push(`Faction [${f.map(t=>t.name).join(',')}] Roll -> Power: ${pwr.toFixed(1)} * RNG: ${rng.toFixed(2)} = ${roll.toFixed(1)}`);\n            return { f, roll };\n        }).sort((a,b) => b.roll - a.roll);\n        \n        let winner = rolls[0];\n        logs.push(`Winner determined: [${winner.f.map(t=>t.name).join(',')}]`);\n\n        // Standard Combat Processing\n        rolls.slice(1).forEach(loser => {\n            loser.f.forEach(t => {\n                let dmg = isArenaEvent ? randInt(80, 150) : randInt(40, 90);\n                logs.push(`${t.name} sustained ${dmg} damage.`);\n                t.hp -= dmg;\n                if (t.hp <= 0 && this.killTribute(t, winner.f[0].name)) {\n                    dead.push(t);\n                    logs.push(`>> ${t.name} HP fell below 0. Marked as KIA.`);\n                }\n            });\n        });\n\n        // Resolve Lethal Override if no one died naturally\n        if (triggerLethalOverride && dead.length === 0) {\n            logs.push(`Lethal Override active and no natural deaths occurred. Forcing fatality via power elimination...`);\n            let allCombatants = factions.flat(); // We know they are all alive since dead.length === 0\n\n            if (allCombatants.length > 1) {\n                const winnerNameSet = new Set(winner.f.map(t => t.name));\n                const allowSameFactionOverride = winner.f.length >= 2 && Math.random() < 0.05;\n                logs.push(`>> Override target mode: ${allowSameFactionOverride ? 'same-faction betrayal eligible (5%)' : 'enemy-only default'}.`);\n\n                const enemyPool = allCombatants.filter(t => !winnerNameSet.has(t.name));\n                const eligibleCombatants = allowSameFactionOverride ? [...allCombatants] : enemyPool;\n                let unsafe = eligibleCombatants.length > 0 ? [...eligibleCombatants] : [...allCombatants];\n\n                if (!allowSameFactionOverride && enemyPool.length === 0) {\n                    logs.push(`>> Override fallback: no external enemies available, using all combatants.`);\n                }\n\n                // Play \"Hot Potato\" until one is left\n                while (unsafe.length > 1) {\n                    let totalPower = Math.floor(unsafe.reduce((sum, t) => sum + t.calculatePower(), 0));\n                    let safeRoll = randInt(1, Math.max(1, totalPower)); // Minimum 1 for math safety\n                    \n                    let cumulative = 0;\n                    let safeIndex = 0;\n\n                    for (let i = 0; i < unsafe.length; i++) {\n                        cumulative += Math.floor(unsafe[i].calculatePower());\n                        if (safeRoll <= cumulative) {\n                            safeIndex = i;\n                            break;\n                        }\n                    }\n                    \n                    logs.push(`>> Override Roll (${safeRoll}/${totalPower}): ${unsafe[safeIndex].name} survived.`);\n                    unsafe.splice(safeIndex, 1); // Remove the safe person from the unsafe pool\n                }\n\n                // The last remaining person is killed\n                let doomed = unsafe[0];\n                logs.push(`>> Lethal Override Complete: ${doomed.name} failed to secure safety. Marked as KIA.`);\n                doomed.hp = 0;\n                if (this.killTribute(doomed, winner.f[0].name)) {\n                    dead.push(doomed);\n                }\n            }\n        }\n\n        const factionSides = factions\n            .map(f => formatNames(f.map(t => t.name)))\n            .filter(Boolean);\n        let fStr = factionSides.join(' and ');\n        \n        if (dead.length > 0) {\n            let deadNamesStr = formatNames(dead.map(t=>t.name));\n            const deadNameSet = new Set(dead.map(t => t.name));\n            const deadBe = dead.length === 1 ? 'was' : 'were';\n            const winnerNames = winner.f.map(t => t.name);\n            const winnerNameSet = new Set(winnerNames);\n            const winnerAliveNames = winnerNames.filter(name => !deadNameSet.has(name));\n            const opponentNames = winnerAliveNames;\n            const opponentStr = opponentNames.length > 0 ? formatNames(opponentNames) : 'their opponents';\n            const betrayedDead = dead.filter(t => winnerNameSet.has(t.name));\n            const nonBetrayedDead = dead.filter(t => !winnerNameSet.has(t.name));\n            const betrayalMode = betrayedDead.length > 0;\n            const externalOpponentNames = Array.from(new Set(\n                factions\n                    .flat()\n                    .map(t => t.name)\n                    .filter(name => !winnerNameSet.has(name))\n            ));\n            const showFactionBetrayalContext = betrayalMode && winnerNames.length >= 2 && externalOpponentNames.length > 0;\n\n            logs.push(`Combat narration mode: ${betrayalMode ? 'Betrayal' : 'Standard'}.`);\n\n            const deathTemplates = [\n                `${deadNamesStr} ${deadBe} cut down during a chaotic struggle against ${opponentStr}.`,\n                `During a struggle with ${opponentStr}, ${deadNamesStr} ${deadBe} shoved off a cliff.`,\n                `${deadNamesStr} ${deadBe} hurled into a deep ravine following a clash with ${opponentStr}.`,\n                `${opponentStr} forced ${deadNamesStr} to the ground in a fatal finish.`,\n                `${deadNamesStr} ${deadBe} stabbed through the chest while engaged with ${opponentStr}.`,\n                `${opponentStr} found an opening and finished ${deadNamesStr} at close range.`,\n                `In the middle of a skirmish with ${opponentStr}, ${deadNamesStr} ${deadBe} run through with a blade.`,\n                `${opponentStr} impaled ${deadNamesStr} on a piece of debris during the struggle.`,\n                `${deadNamesStr} ${deadBe} trampled during a charge by ${opponentStr}.`,\n                `${opponentStr} delivered a fatal strike, felling ${deadNamesStr}.`,\n                `Following a spat with ${opponentStr}, ${deadNamesStr} ${deadBe} fatally injured.`,\n                `${opponentStr} overwhelmed ${deadNamesStr} and ended the fight with a crushing blow.`,\n                `${deadNamesStr} met their end after ${opponentStr} pushed them into a pit of spikes.`,\n                `${deadNamesStr} ${deadBe} finished off by a precise stab to the heart from ${opponentStr}.`,\n                `${opponentStr} slammed ${deadNamesStr} into a stone wall, killing them instantly.`,\n            ];\n\n            let deathText = pickRandom(deathTemplates);\n            if (betrayalMode) {\n                const betrayedNamesStr = formatNames(betrayedDead.map(t => t.name));\n                const betrayedNameSet = new Set(betrayedDead.map(t => t.name));\n                const turncoatNames = winnerAliveNames.filter(name => !betrayedNameSet.has(name));\n                const hasNamedTurncoat = turncoatNames.length > 0;\n                const turncoatStr = hasNamedTurncoat ? formatNames(turncoatNames) : 'former allies';\n                const betrayedBe = betrayedDead.length === 1 ? 'was' : 'were';\n\n                if (nonBetrayedDead.length > 0) {\n                    const nonBetrayedNamesStr = formatNames(nonBetrayedDead.map(t => t.name));\n                    const nonBetrayedBe = nonBetrayedDead.length === 1 ? 'was' : 'were';\n                    const betrayalMixedTemplates = hasNamedTurncoat\n                        ? [\n                            `${nonBetrayedNamesStr} ${nonBetrayedBe} killed in the clash, then betrayal erupted as ${turncoatStr} turned on ${betrayedNamesStr}.`,\n                            `The battle initially claimed ${nonBetrayedNamesStr}, but it ended in treachery when ${turncoatStr} murdered ${betrayedNamesStr}.`,\n                            `${nonBetrayedNamesStr} fell in the fight, and moments later ${turncoatStr} betrayed and killed ${betrayedNamesStr}.`,\n                        ]\n                        : [\n                            `${nonBetrayedNamesStr} ${nonBetrayedBe} killed in the clash, and then ${betrayedNamesStr} ${betrayedBe} slain by former allies in the chaos.`,\n                            `The battle initially claimed ${nonBetrayedNamesStr}, but ended in treachery as ${betrayedNamesStr} ${betrayedBe} killed by former allies.`,\n                            `${nonBetrayedNamesStr} fell first, and moments later ${betrayedNamesStr} ${betrayedBe} betrayed and killed by former allies.`,\n                        ];\n                    deathText = pickRandom(betrayalMixedTemplates);\n                } else {\n                    const betrayalTemplates = hasNamedTurncoat\n                        ? [\n                            `Betrayal broke out mid-fight as ${turncoatStr} turned on ${betrayedNamesStr}, and ${betrayedNamesStr} ${betrayedBe} killed.`,\n                            `The clash turned into treachery when ${turncoatStr} stabbed ${betrayedNamesStr} in the chaos.`,\n                            `${turncoatStr} switched targets and murdered ${betrayedNamesStr} during the confusion.`,\n                        ]\n                        : [\n                            `Betrayal broke out mid-fight, and ${betrayedNamesStr} ${betrayedBe} killed by former allies.`,\n                            `The clash collapsed into treachery as ${betrayedNamesStr} ${betrayedBe} slain by former allies in the chaos.`,\n                            `In the confusion, former allies turned and killed ${betrayedNamesStr}.`,\n                        ];\n                    deathText = pickRandom(betrayalTemplates);\n                }\n\n                if (showFactionBetrayalContext) {\n                    const factionContext = `${formatNames(winnerNames)} were fighting ${formatNames(externalOpponentNames)}.`;\n                    deathText = `${factionContext}<br><br>${deathText}`;\n                }\n            }\n\n            const combinedDeathText = prefaceText ? `${prefaceText}<br><br>${deathText}` : deathText;\n            this.createSlide(combinedDeathText, \"death\", logs);\n        } else {\n            const noDeathTemplates = [\n                `A skirmish involving ${fStr} ended with everyone still alive.`,\n                `A tense clash among ${fStr} left no fatalities.`,\n                `Weapons were drawn among ${fStr}, but the battle ended without a death.`,\n                `${fStr} traded heavy blows, but all combatants survived.`,\n                `After a confrontation involving ${fStr}, everyone managed to survive.`,\n                `The fight involving ${fStr} was brief and ended without deaths.`,\n            ];\n            const noDeathText = pickRandom(noDeathTemplates);\n            const combinedNoDeathText = prefaceText ? `${prefaceText}<br><br>${noDeathText}` : noDeathText;\n            this.createSlide(combinedNoDeathText, noDeathStyleClass, logs);\n        }\n    }\n\n    handleSolo(t, logs) {\n        const r = Math.random();\n        logs.push(`Evaluating Solo Event for ${t.name}. RNG Roll: ${r.toFixed(3)}`);\n        \n        if (r < 0.30) {\n            logs.push(`Roll fell in lethal threshold (< 0.30)`);\n            const hazards = [\"a landmine\", \"a venomous mutt\", \"dehydration\", \"a fall from a cliff\", \"poisonous berries\"];\n            const cause = pickRandom(hazards);\n            t.hp = 0;\n            if (this.killTribute(t, cause)) {\n                this.createSlide(`<strong>${t.name}<\/strong> was killed by ${cause}.`, \"death\", logs);\n            }\n        } else if (r < 0.50) {\n            logs.push(`Roll fell in weapon threshold (< 0.50)`);\n            t.weapons += 1;\n            this.createSlide(`<strong>${t.name}<\/strong> found a weapon cache.`, \"special\", logs);\n        } else if (r < 0.75) {\n            logs.push(`Roll fell in healing threshold (< 0.75)`);\n            t.hp = Math.min(t.hp + 20, t.maxHp);\n            this.createSlide(`<strong>${t.name}<\/strong> managed to find clean water and food.`, \"special\", logs);\n        } else {\n            logs.push(`Roll fell in neutral threshold (>= 0.75)`);\n            this.createSlide(`<strong>${t.name}<\/strong> stayed hidden and rested.`, \"neutral\", logs);\n        }\n    }\n\n    killTribute(t, k) {\n        let livingCount = this.tributes.filter(x => x.isAlive).length;\n        if (livingCount <= 1) { t.hp = 1; return false; } \n\n        const killerTribute = this.tributes.find(x => x.name === k && x.isAlive);\n        if (killerTribute) killerTribute.kills += 1;\n\n        t.isAlive = false; t.hp = 0; this.deathCounter++; t.deathOrder = this.deathCounter;\n        t.deathPhase = this.getPhaseName(); t.killedBy = k; this.deathsThisPhase.push(t);\n        this.tributes.forEach(x => x.allies.delete(t.name));\n        return true;\n    }\n\n    generateSummaryScreen() {\n        let living = this.tributes.filter(t => t.isAlive);\n        let deadAllTime = this.tributes.filter(t => !t.isAlive).sort((a, b) => b.deathOrder - a.deathOrder);\n\n        let html = `<div class=\"summary-box\">\n            <div class=\"full-width\" style=\"text-align:center;\"><h2>Status Report<\/h2><p>Alive: ${living.length}<\/p><\/div>\n            \n            <div class=\"summary-section\">\n                <h3>Living<\/h3>\n                <ul class=\"summary-list\">\n                    ${living.map(t => `\n                        <li>\n                            <div class=\"row-header\">\n                                <strong>${t.name} <span class=\"verbose-stats\">(Kills: ${t.kills})<\/span><\/strong> \n                                ${t.getHealthHTML()}\n                            <\/div>\n                            ${t.allies.size > 0 ? `<div class=\"alliance-tag\">Allies: ${Array.from(t.allies).join(', ')}<\/div>` : ''}\n                        <\/li>\n                    `).join('')}\n                <\/ul>\n            <\/div>\n            \n            <div class=\"summary-section\">\n                <h3>Fallen This Phase<\/h3>\n                <ul class=\"summary-list\">\n                    ${this.deathsThisPhase.length === 0 ? '<li>None<\/li>' : this.deathsThisPhase.map(t => `<li><strong>${t.name}<\/strong><br><small>Killed by: ${t.killedBy}<\/small><\/li>`).join('')}\n                <\/ul>\n            <\/div>\n\n            <div class=\"summary-section full-width\">\n                <h3>The Deceased<\/h3>\n                <p style=\"margin:0; color:#94a3b8; font-size:1rem;\">${deadAllTime.length === 0 ? 'None yet' : deadAllTime.map(t => t.name).join(', ')}<\/p>\n            <\/div>\n\n            <div class=\"full-width\" style=\"text-align:center;margin-top:20px;margin-bottom:20px;\">\n                <button onclick=\"game.playRound()\">Next Phase<\/button>\n            <\/div>\n        <\/div>`;\n        this.createSlide(html, \"summary\");\n    }\n\n    handleEndGame(w) {\n        let dead = this.tributes.filter(t => !t.isAlive).sort((a,b) => b.deathOrder - a.deathOrder);\n        let victorName = w ? w.name : \"No one\";\n        \n        let html = `\n            <div style=\"text-align:center; border-top-color:var(--accent); width: 100%;\">\n                <h1 style=\"color:var(--accent); font-size:4rem; margin:0;\">VICTOR<\/h1>\n                <h2 style=\"font-size:3rem; margin:10px 0;\">${victorName}<\/h2>\n                <div style=\"margin-top:30px; text-align:left;\">\n                    <h3>Final Standings:<\/h3>\n                    <ul class=\"summary-list\">\n                        ${dead.map(t => `<li><strong>${t.name}<\/strong> - Died on ${t.deathPhase} (Killed by: ${t.killedBy})<\/li>`).join('')}\n                    <\/ul>\n                <\/div>\n                <button onclick=\"location.reload()\" style=\"margin-top:40px\">New Simulation<\/button>\n            <\/div>`;\n        \n        document.getElementById('log').innerHTML = ''; \n        this.slides = []; \n        this.createSlide(html, \"special\"); \n        this.renderSlides(); \n    }\n}\n\nlet game;\nfunction setupGame() {\n    const input = document.getElementById('nameInput').value;\n    let lines = input.split('\\n').map(l => l.trim()).filter(l => l !== \"\");\n    const isV = lines.includes(\"--verbose\");\n    const names = lines.filter(l => l !== \"--verbose\");\n    if (names.length < 2) return alert(\"Min 2 tributes\");\n    game = new Engine(names, isV);\n    document.getElementById('reaping-phase').style.display = 'none';\n    document.getElementById('game-phase').style.display = 'block';\n    game.playRound();\n}\n<\/script>\n<\/body>\n<\/html>", "page_1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n    <title>Neon Run 3D<\/title>\n    <style>\n        body {\n            margin: 0;\n            overflow: hidden;\n            background-color: #050510;\n            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            user-select: none;\n            -webkit-touch-callout: none;\n        }\n        #game-container {\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100vw;\n            height: 100vh;\n        }\n        #ui {\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            pointer-events: none;\n            display: flex;\n            flex-direction: column;\n        }\n        .screen {\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            display: flex;\n            flex-direction: column;\n            justify-content: center;\n            align-items: center;\n            background: rgba(5, 5, 16, 0.85);\n            backdrop-filter: blur(5px);\n            z-index: 10;\n        }\n        h1 {\n            color: #00e5ff;\n            font-size: 4rem;\n            text-transform: uppercase;\n            letter-spacing: 5px;\n            text-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff;\n            margin: 0 0 10px 0;\n            text-align: center;\n        }\n        p {\n            color: #aaddff;\n            font-size: 1.2rem;\n            margin: 10px 0;\n            text-align: center;\n            max-width: 600px;\n            padding: 0 20px;\n        }\n        .controls-hint {\n            display: flex;\n            gap: 20px;\n            margin: 30px 0;\n            flex-wrap: wrap;\n            justify-content: center;\n        }\n        .key-badge {\n            background: rgba(0, 229, 255, 0.1);\n            border: 1px solid #00e5ff;\n            padding: 8px 15px;\n            border-radius: 8px;\n            color: #fff;\n            font-weight: bold;\n            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);\n        }\n        button {\n            pointer-events: auto;\n            margin-top: 20px;\n            padding: 15px 40px;\n            font-size: 1.5rem;\n            background: transparent;\n            border: 2px solid #ff00ff;\n            color: #ff00ff;\n            border-radius: 30px;\n            font-weight: bold;\n            cursor: pointer;\n            text-transform: uppercase;\n            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5), inset 0 0 15px rgba(255, 0, 255, 0.3);\n            transition: all 0.3s ease;\n        }\n        button:hover {\n            background: #ff00ff;\n            color: #fff;\n            box-shadow: 0 0 30px #ff00ff, inset 0 0 10px #fff;\n            transform: scale(1.05);\n        }\n        #hud {\n            position: absolute;\n            top: 30px;\n            left: 30px;\n            color: #fff;\n            font-size: 2rem;\n            font-weight: 800;\n            text-shadow: 0 0 10px #00e5ff;\n            display: none;\n            z-index: 5;\n        }\n        .touch-areas {\n            position: absolute;\n            bottom: 0;\n            left: 0;\n            width: 100%;\n            height: 50%;\n            display: flex;\n            pointer-events: none;\n            z-index: 1;\n        }\n        #mobile-controls {\n            position: absolute;\n            bottom: 30px;\n            left: 0;\n            width: 100%;\n            display: none; /* Hidden by default */\n            justify-content: space-between;\n            padding: 0 30px;\n            box-sizing: border-box;\n            z-index: 20;\n            pointer-events: none;\n        }\n        .control-group {\n            display: flex;\n            gap: 20px;\n            pointer-events: auto;\n        }\n        .btn-mobile {\n            width: 70px;\n            height: 70px;\n            background: rgba(255, 0, 255, 0.1);\n            border: 2px solid #ff00ff;\n            border-radius: 50%;\n            color: #ff00ff;\n            font-size: 2rem;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            user-select: none;\n            -webkit-user-select: none;\n            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.2);\n            cursor: pointer;\n        }\n        .btn-mobile:active {\n            background: rgba(255, 0, 255, 0.5);\n            box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);\n        }\n        .btn-jump {\n            width: 100px;\n            border-radius: 35px;\n        }\n        @media (max-width: 768px) {\n            h1 { font-size: 2.5rem; }\n            button { font-size: 1.2rem; padding: 12px 30px; }\n            #hud { top: 15px; left: 15px; font-size: 1.5rem; }\n        }\n    <\/style>\n<\/head>\n<body>\n    <div id=\"game-container\"><\/div>\n    \n    <div id=\"ui\">\n        <div id=\"start-screen\" class=\"screen\">\n            <h1>Neon Run<\/h1>\n            <p>Navigate the endless void. Dodge the gaps and survive as long as you can!<\/p>\n            <div class=\"controls-hint\">\n                <span class=\"key-badge\">Left/Right Arrows (or A/D) to Move<\/span>\n                <span class=\"key-badge\">Spacebar to Jump<\/span>\n            <\/div>\n            <div style=\"display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;\">\n                <button onclick=\"startGame('computer')\">Play on Computer<\/button>\n                <button onclick=\"startGame('phone')\">Play on Phone<\/button>\n            <\/div>\n        <\/div>\n        \n        <div id=\"game-over-screen\" class=\"screen\" style=\"display: none;\">\n            <h1 style=\"color: #ff00ff; text-shadow: 0 0 20px #ff00ff;\">Void Reached<\/h1>\n            <p id=\"final-score\" style=\"font-size: 2rem; color: #fff; font-weight: bold;\">Score: 0<\/p>\n            <button onclick=\"resetGame()\">Play Again<\/button>\n        <\/div>\n        \n        <div id=\"hud\">Distance: <span id=\"score-val\">0<\/span>m<\/div>\n        \n        <div id=\"mobile-controls\">\n            <div class=\"control-group\">\n                <div class=\"btn-mobile\" id=\"btn-left\">\u25c0<\/div>\n                <div class=\"btn-mobile\" id=\"btn-right\">\u25b6<\/div>\n            <\/div>\n            <div class=\"control-group\">\n                <div class=\"btn-mobile btn-jump\" id=\"btn-jump\">\u25b2<\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Three.js Library -->\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n\n    <script>\n        // --- Game Variables ---\n        let scene, camera, renderer;\n        let player, tunnelGroup;\n        let activeTiles = [];\n        \n        // Physics & Movement\n        const clock = new THREE.Clock();\n        const keys = { ArrowLeft: false, ArrowRight: false, Space: false };\n        let currentSpeed = 15;\n        const startSpeed = 15;\n        const jumpForce = 18;\n        const gravity = 45;\n        const moveSpeed = 14;\n        \n        let playerVelocityY = 0;\n        let isGrounded = false;\n        \n        // Track Generation\n        const tileSize = 2.4;  // Size of one grid block\n        const gridWidth = 7;   // 7 lanes wide\n        let furthestZ = 0;\n        \n        // State\n        let gameState = 'START'; // START, PLAYING, GAMEOVER\n        let score = 0;\n        \n        // Path logic to ensure the game is mathematically always beatable\n        let pathX = Math.floor(gridWidth / 2);\n\n        // Materials & Geometry\n        const tileGeo = new THREE.BoxGeometry(tileSize, 0.4, tileSize);\n        const tileMat = new THREE.MeshStandardMaterial({\n            color: 0x2a2a45, // Brighter blue-grey to contrast heavily with the void\n            emissive: 0x050515,\n            roughness: 0.7,\n            metalness: 0.3\n        });\n        const edgeGeo = new THREE.EdgesGeometry(tileGeo);\n        const edgeMat = new THREE.LineBasicMaterial({ color: 0x00e5ff, linewidth: 2 });\n        \n        // DOM Elements\n        const uiStart = document.getElementById('start-screen');\n        const uiGameOver = document.getElementById('game-over-screen');\n        const uiScoreContainer = document.getElementById('hud');\n        const scoreVal = document.getElementById('score-val');\n        const finalScore = document.getElementById('final-score');\n\n        // --- Initialization ---\n        function init() {\n            // Scene Setup\n            scene = new THREE.Scene();\n            scene.background = new THREE.Color(0x000000); // Pure black void\n            scene.fog = new THREE.FogExp2(0x000000, 0.012);\n\n            // Camera Setup\n            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);\n\n            // Renderer Setup\n            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for high DPI\n            document.getElementById('game-container').appendChild(renderer.domElement);\n\n            // Lighting\n            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);\n            scene.add(ambientLight);\n\n            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);\n            directionalLight.position.set(10, 20, 10);\n            scene.add(directionalLight);\n\n            // Tunnel Group (holds all tiles and rotates the world)\n            tunnelGroup = new THREE.Group();\n            scene.add(tunnelGroup);\n\n            // Player Setup\n            const playerGeo = new THREE.BoxGeometry(1, 1, 1);\n            const playerMat = new THREE.MeshStandardMaterial({ \n                color: 0xff00ff, \n                emissive: 0xaa00aa,\n                emissiveIntensity: 0.5,\n                roughness: 0.2\n            });\n            player = new THREE.Mesh(playerGeo, playerMat);\n            \n            // Add a point light attached to the player\n            const playerLight = new THREE.PointLight(0xff00ff, 1.5, 25);\n            playerLight.position.set(0, 1.5, 0);\n            player.add(playerLight);\n            \n            scene.add(player);\n\n            // Event Listeners\n            window.addEventListener('resize', onWindowResize, false);\n            setupInput();\n\n            // Render loop\n            animate();\n        }\n\n        let isMobileMode = false;\n\n        function startGame(deviceType) {\n            isMobileMode = (deviceType === 'phone');\n            if (isMobileMode) {\n                document.getElementById('mobile-controls').style.display = 'flex';\n            } else {\n                document.getElementById('mobile-controls').style.display = 'none';\n            }\n            resetGame();\n        }\n\n        function resetGame() {\n            // Cleanup existing tiles\n            activeTiles.forEach(t => {\n                tunnelGroup.remove(t);\n                t.geometry.dispose();\n            });\n            activeTiles = [];\n            \n            // Reset Variables\n            player.position.set(0, 2, 0);\n            playerVelocityY = 0;\n            isGrounded = false;\n            \n            currentSpeed = startSpeed;\n            score = 0;\n            furthestZ = 0;\n            \n            pathX = Math.floor(gridWidth / 2);\n            \n            // Generate initial safe zone runway\n            for (let z = 5; z > -150; z -= tileSize) {\n                generateRow(z, z > -50); // Force solid path for first 50 units\n            }\n            \n            // Update UI\n            gameState = 'PLAYING';\n            uiStart.style.display = 'none';\n            uiGameOver.style.display = 'none';\n            uiScoreContainer.style.display = 'block';\n            clock.start();\n        }\n\n        function gameOver() {\n            gameState = 'GAMEOVER';\n            uiGameOver.style.display = 'flex';\n            uiScoreContainer.style.display = 'none';\n            finalScore.innerText = `Distance: ${Math.floor(score)}m`;\n        }\n\n        // --- Level Generation ---\n        function createTile(xIndex, z) {\n            const mesh = new THREE.Mesh(tileGeo, tileMat);\n            \n            // Add neon edges\n            const edges = new THREE.LineSegments(edgeGeo, edgeMat);\n            mesh.add(edges);\n            \n            // Flag for raycaster collision detection\n            mesh.userData.isTile = true;\n            \n            // Calculate position relative to the center\n            const localX = (xIndex - gridWidth / 2 + 0.5) * tileSize;\n            mesh.position.set(localX, 0, z);\n            \n            tunnelGroup.add(mesh);\n            activeTiles.push(mesh);\n        }\n\n        function generateRow(z, forceSolid = false) {\n            // 1. Move the guaranteed path walker occasionally\n            if (!forceSolid && Math.random() < 0.4) {\n                pathX += (Math.random() < 0.5 ? -1 : 1);\n                \n                // Clamp within bounds\n                pathX = Math.max(0, Math.min(gridWidth - 1, pathX));\n            }\n            \n            // 2. Generate tiles for the floor\n            for (let x = 0; x < gridWidth; x++) {\n                let shouldCreateTile = true;\n                \n                if (!forceSolid) {\n                    if (x === pathX) {\n                        shouldCreateTile = true; // Always guarantee the path\n                    } else {\n                        // 35% chance for a gap, creating the obstacle layout\n                        shouldCreateTile = Math.random() > 0.35; \n                    }\n                }\n                \n                if (shouldCreateTile) {\n                    createTile(x, z);\n                }\n            }\n            furthestZ = z;\n        }\n\n        // --- Main Game Loop ---\n        function animate() {\n            requestAnimationFrame(animate);\n            \n            const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent huge jumps on lag\n\n            if (gameState === 'PLAYING') {\n                updateGame(delta);\n            }\n\n            // Smoothly move camera\n            if (gameState === 'PLAYING' || gameState === 'START') {\n                // Keep camera centered on X, high above Y, tracking Z\n                camera.position.x += (0 - camera.position.x) * 5 * delta; \n                \n                const targetCamY = player.position.y + 7.5; // Steeper angle height\n                camera.position.y += (targetCamY - camera.position.y) * 5 * delta;\n                \n                camera.position.z = player.position.z + 10;\n                \n                // Look closer to the player for a steeper downward angle\n                camera.lookAt(player.position.x * 0.3, player.position.y - 2, player.position.z - 8);\n            }\n\n            renderer.render(scene, camera);\n        }\n\n        function updateGame(delta) {\n            // 1. Forward Movement & Score\n            player.position.z -= currentSpeed * delta;\n            score += currentSpeed * delta * 0.1;\n            scoreVal.innerText = Math.floor(score);\n            \n            // Gradually increase difficulty\n            currentSpeed += delta * 0.15; \n\n            // 2. Continuous Track Generation\n            while (furthestZ > player.position.z - 120) {\n                generateRow(furthestZ - tileSize);\n            }\n\n            // Cleanup passed tiles\n            for (let i = activeTiles.length - 1; i >= 0; i--) {\n                const tile = activeTiles[i];\n                if (tile.position.z > player.position.z + 15) {\n                    tunnelGroup.remove(tile);\n                    // Dispose geometry to prevent memory leaks, materials are shared\n                    tile.geometry.dispose(); \n                    activeTiles.splice(i, 1);\n                }\n            }\n\n            // 3. Lateral Movement (Strafe)\n            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {\n                player.position.x -= moveSpeed * delta;\n                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0.2, 10 * delta); // Tilt visual\n            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {\n                player.position.x += moveSpeed * delta;\n                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -0.2, 10 * delta);\n            } else {\n                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 10 * delta);\n            }\n\n            // 4. Gravity & Jumping\n            playerVelocityY -= gravity * delta;\n            player.position.y += playerVelocityY * delta;\n\n            // 5. Collision Detection \n            const raycaster = new THREE.Raycaster(\n                player.position.clone(), \n                new THREE.Vector3(0, -1, 0),\n                0,\n                5 // Max ray distance\n            );\n            \n            const meshesOnly = tunnelGroup.children.filter(child => child.userData.isTile);\n            const intersects = raycaster.intersectObjects(meshesOnly, false);\n            \n            isGrounded = false;\n            if (intersects.length > 0) {\n                const hit = intersects[0];\n                if (hit.distance < 0.6 && playerVelocityY <= 0) {\n                    player.position.y = hit.point.y + 0.5; // Snap perfectly to the surface\n                    playerVelocityY = 0;\n                    isGrounded = true;\n                }\n            }\n\n            // Apply Jump\n            if (isGrounded && (keys['Space'] || keys['ArrowUp'] || keys['w'] || keys['W'])) {\n                playerVelocityY = jumpForce;\n                isGrounded = false;\n                keys['Space'] = false; // Require releasing key to jump again (or tap)\n            }\n\n            // 6. Death Condition (Falling into the void)\n            if (player.position.y < -15) {\n                gameOver();\n            }\n        }\n\n        // --- Input Handling ---\n        function setupInput() {\n            // Keyboard\n            window.addEventListener('keydown', (e) => {\n                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {\n                    e.preventDefault(); // Prevent page scrolling\n                }\n                keys[e.code] = true;\n                keys[e.key] = true;\n            }, {passive: false});\n\n            window.addEventListener('keyup', (e) => {\n                keys[e.code] = false;\n                keys[e.key] = false;\n            });\n\n            // Specific touch buttons for mobile controls\n            const btnLeft = document.getElementById('btn-left');\n            const btnRight = document.getElementById('btn-right');\n            const btnJump = document.getElementById('btn-jump');\n\n            const bindBtn = (element, key) => {\n                const press = (e) => { e.preve
