play\">0M<\/div>\n        <div class=\"controls-hint\">\n            <span>&lt; Brake / Frontflip<\/span>\n            <span>Gas / Backflip &gt;<\/span>\n        <\/div>\n    <\/div>\n\n    <script>\n        const canvas = document.getElementById('gameCanvas');\n        const ctx = canvas.getContext('2d', { alpha: false });\n        const distanceDisplay = document.getElementById('distanceDisplay');\n\n        let width = canvas.width = window.innerWidth;\n        let height = canvas.height = window.innerHeight;\n\n        window.addEventListener('resize', () => {\n            width = canvas.width = window.innerWidth;\n            height = canvas.height = window.innerHeight;\n        });\n\n        const keys = { left: false, right: false };\n        let distance = 0;\n        const camera = { x: 0, y: 0 };\n        const particles = [];\n\n        // --- PROCEDURAL TERRAIN (UPGRADED) ---\n        function getTerrain(x) {\n            let y = 0;\n            \n            // 1. Massive Continental Slopes (Very low freq, massive height)\n            y += Math.sin(x * 0.0004) * 400; \n\n            // 2. Large Rolling Mountains\n            y += Math.sin(x * 0.0015) * 200;  \n\n            // 3. Jump Ramps and Dips\n            y += Math.cos(x * 0.005) * 80;   \n\n            // 4. Amplitude Modulated \"Rough Zones\" \n            // Multiplies a high-frequency wave by a low-frequency wave \n            // to create areas of intense bumps followed by smooth valleys.\n            let ruggedness = (Math.sin(x * 0.0008) + 1) / 2; // Ranges from 0 to 1\n            y += Math.sin(x * 0.015) * (60 * ruggedness);\n\n            return y + 600; // Shifted base down to accommodate massive peaks\n        }\n\n        function getTerrainNormal(x) {\n            let eps = 2;\n            let dy = getTerrain(x + eps) - getTerrain(x - eps);\n            let dx = eps * 2;\n            let len = Math.hypot(dx, dy);\n            return { nx: dy / len, ny: -dx / len }; \n        }\n\n        // --- PHYSICS ENTITY: CAR ---\n        const car = {\n            x: 0, y: 100,\n            oldX: 0, oldY: 100,\n            angle: 0, oldAngle: 0,\n            wheelAngle: 0,\n            contactTimer: 0, \n            \n            // Exact User Provided Physics Specs\n            wheelBase: 28,      \n            suspension: 16, \n            wheelRadius: 10,    \n            gravity: 0.30,      \n            enginePower: 1.8,   \n            airRotation: 0.005,  \n            friction: 0.995,    \n            groundFriction: 0.99,\n\n            update: function() {\n                let vx = this.x - this.oldX;\n                let vy = this.y - this.oldY;\n                let va = this.angle - this.oldAngle;\n\n                this.oldX = this.x;\n                this.oldY = this.y;\n                this.oldAngle = this.angle;\n\n                vy += this.gravity;\n\n                let isGrounded = this.contactTimer > 0;\n\n                // Input Application \n                if (keys.right) {\n                    if (isGrounded) {\n                        vx += Math.cos(this.angle) * this.enginePower;\n                        vy += Math.sin(this.angle) * this.enginePower;\n                        this.spawnExhaust();\n                    } else {\n                        va -= this.airRotation; \n                    }\n                }\n                if (keys.left) {\n                    if (isGrounded) {\n                        vx -= Math.cos(this.angle) * (this.enginePower * 0.8);\n                        vy -= Math.sin(this.angle) * (this.enginePower * 0.8);\n                    } else {\n                        va += this.airRotation; \n                    }\n                }\n\n                vx *= this.friction;\n                vy *= this.friction;\n                va *= 0.95; \n                \n                if (isGrounded) vx *= this.groundFriction;\n\n                this.x += vx;\n                this.y += vy;\n                this.angle += va;\n\n                this.wheelAngle += (vx * Math.cos(this.angle) + vy * Math.sin(this.angle)) / this.wheelRadius;\n                \n                if (this.contactTimer > 0) this.contactTimer--;\n\n                // Constraint Resolution\n                for (let i = 0; i < 3; i++) {\n                    const cos = Math.cos(this.angle);\n                    const sin = Math.sin(this.angle);\n\n                    // Front Wheel\n                    let fx = this.x + cos * this.wheelBase - sin * this.suspension;\n                    let fy = this.y + sin * this.wheelBase + cos * this.suspension;\n                    let terrainF = getTerrain(fx);\n\n                    if (fy + this.wheelRadius > terrainF) {\n                        this.resolveCollision(fx, fy + this.wheelRadius, terrainF, -1);\n                    }\n\n                    // Rear Wheel\n                    let rx = this.x - cos * this.wheelBase - sin * this.suspension;\n                    let ry = this.y - sin * this.wheelBase + cos * this.suspension;\n                    let terrainR = getTerrain(rx);\n\n                    if (ry + this.wheelRadius > terrainR) {\n                        this.resolveCollision(rx, ry + this.wheelRadius, terrainR, 1);\n                    }\n\n                    // Zen Bounce Logic (Auto-righting if landing on roof)\n                    let upVecY = -Math.cos(this.angle); \n                    if (upVecY > 0.4 && this.y > getTerrain(this.x) - 45) {\n                        this.y -= 4; \n                        this.oldY = this.y + 10; \n                        let correctiveTorque = Math.sin(this.angle) * 0.2;\n                        this.oldAngle = this.angle + correctiveTorque; \n                    }\n                }\n            },\n\n            resolveCollision: function(wx, wy, terrainY, torqueDirection) {\n                let depth = wy - terrainY;\n                let n = getTerrainNormal(wx);\n                \n                let pushX = n.nx * depth * 0.4;\n                let pushY = n.ny * depth * 0.4;\n                \n                this.x += pushX;\n                this.y += pushY;\n                \n                this.oldX += pushX * 0.85; \n                this.oldY += pushY * 0.85;\n                \n                let angleTorque = depth * 0.003 * torqueDirection;\n                this.angle += angleTorque;\n                this.oldAngle += angleTorque * 0.85;\n                \n                this.contactTimer = 2;\n            },\n\n            spawnExhaust: function() {\n                if (Math.random() > 0.4) return;\n                let cos = Math.cos(this.angle);\n                let sin = Math.sin(this.angle);\n                let px = this.x - cos * this.wheelBase - sin * this.suspension;\n                let py = this.y - sin * this.wheelBase + cos * this.suspension;\n                \n                particles.push({\n                    x: px, y: py,\n                    vx: -cos * 3 + (Math.random() - 0.5),\n                    vy: -sin * 3 + (Math.random() - 0.5),\n                    life: 1.0\n                });\n            }\n        };\n\n        // --- INPUT HANDLING ---\n        window.addEventListener('keydown', (e) => {\n            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;\n            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;\n        });\n\n        window.addEventListener('keyup', (e) => {\n            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;\n            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;\n        });\n\n        const handleTouches = (e) => {\n            e.preventDefault();\n            let leftPressed = false, rightPressed = false;\n            \n            for (let i = 0; i < e.touches.length; i++) {\n                if (e.touches[i].clientX < width / 2) leftPressed = true;\n                else rightPressed = true;\n            }\n            \n            keys.left = leftPressed;\n            keys.right = rightPressed;\n        };\n\n        window.addEventListener('touchstart', handleTouches, { passive: false });\n        window.addEventListener('touchmove', handleTouches, { passive: false });\n        window.addEventListener('touchend', handleTouches, { passive: false });\n        window.addEventListener('touchcancel', handleTouches, { passive: false });\n\n        // --- RENDERING PIPELINE ---\n        function draw() {\n            // Background is drawn static to screen\n            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);\n            bgGrad.addColorStop(0, '#0f0c29');\n            bgGrad.addColorStop(0.5, '#302b63');\n            bgGrad.addColorStop(1, '#24243e');\n            ctx.fillStyle = bgGrad;\n            ctx.fillRect(0, 0, width, height);\n\n            let vx = car.x - car.oldX;\n            let targetCamX = car.x - width * 0.3 + (vx * 15);\n            let targetCamY = car.y - height * 0.6;\n            \n            camera.x += (targetCamX - camera.x) * 0.1;\n            camera.y += (targetCamY - camera.y) * 0.1;\n\n            ctx.save();\n            ctx.translate(-camera.x, -camera.y);\n\n            // Terrain Fill\n            ctx.beginPath();\n            let startX = camera.x - 100; \n            let endX = camera.x + width + 100;\n            \n            // Draw way down so tall mountain bases don't clip\n            ctx.moveTo(startX, camera.y + height + 1500); \n            for (let x = startX; x <= endX; x += 25) { \n                ctx.lineTo(x, getTerrain(x));\n            }\n            ctx.lineTo(endX, camera.y + height + 1500); \n            \n            ctx.fillStyle = 'rgba(0, 243, 255, 0.05)';\n            ctx.fill();\n\n            // Terrain Line\n            ctx.beginPath();\n            for (let x = startX; x <= endX; x += 25) {\n                if (x === startX) ctx.moveTo(x, getTerrain(x));\n                else ctx.lineTo(x, getTerrain(x));\n            }\n            ctx.strokeStyle = '#00f3ff';\n            ctx.lineWidth = 4;\n            ctx.shadowBlur = 12;\n            ctx.shadowColor = '#00f3ff';\n            ctx.stroke();\n            ctx.shadowBlur = 0; \n\n            // Particles\n            for (let i = particles.length - 1; i >= 0; i--) {\n                let p = particles[i];\n                p.x += p.vx; p.y += p.vy;\n                p.life -= 0.05;\n                if (p.life <= 0) {\n                    particles.splice(i, 1);\n                    continue;\n                }\n                ctx.fillStyle = `rgba(255, 0, 127, ${p.life})`;\n                ctx.fillRect(p.x, p.y, 6, 6);\n            }\n\n            // --- CAR RENDERING ---\n            ctx.translate(car.x, car.y); \n            ctx.rotate(car.angle);\n\n            ctx.fillStyle = '#ff007f';\n            ctx.shadowBlur = 15;\n            ctx.shadowColor = '#ff007f';\n            ctx.beginPath();\n            ctx.roundRect(-45, -10, 90, 20, 8); \n            ctx.fill();\n            \n            ctx.fillStyle = '#00f3ff';\n            ctx.shadowBlur = 5;\n            ctx.shadowColor = '#00f3ff';\n            ctx.beginPath();\n            ctx.roundRect(-15, -20, 30, 15, 5);\n            ctx.fill();\n            ctx.shadowBlur = 0;\n\n            ctx.fillStyle = '#ffffff';\n            ctx.beginPath();\n            ctx.arc(0, 0, 3, 0, Math.PI * 2);\n            ctx.fill();\n\n            const drawWheel = (wx, wy) => {\n    ctx.save();\n    ctx.translate(wx, wy);\n    ctx.rotate(car.wheelAngle);\n    \n    // 1. Draw outer wheel rim\n    ctx.strokeStyle = '#00f3ff';\n    ctx.lineWidth = 4;\n    ctx.shadowBlur = 8;\n    ctx.shadowColor = '#00f3ff';\n    ctx.beginPath();\n    ctx.arc(0, 0, car.wheelRadius, 0, Math.PI * 2);\n    ctx.stroke();\n\n    // 2. Draw tread ticks along the edge\n    ctx.lineWidth = 2; // Thinner lines for treads\n    const totalTicks = 12; // Total number of treads\n    const tickLength = 6;  // How far inside the wheel they go\n\n    for (let i = 0; i < totalTicks; i++) {\n        ctx.save();\n        // Rotate to the angle of this specific tick\n        ctx.rotate((Math.PI * 2 / totalTicks) * i);\n        \n        ctx.beginPath();\n        // Draw line from the outer rim inward\n        ctx.moveTo(0, -car.wheelRadius);\n        ctx.lineTo(0, -car.wheelRadius + tickLength);\n        ctx.stroke();\n        ctx.restore();\n    }\n\n    ctx.restore();\n};\n\n\n            drawWheel(car.wheelBase, car.suspension);\n            drawWheel(-car.wheelBase, car.suspension);\n\n            ctx.restore();\n\n            // Score Logic\n            let currentDist = Math.floor(car.x / 50);\n            if (currentDist > distance) distance = currentDist;\n            distanceDisplay.innerText = distance + \"M\";\n        }\n\n        function loop() {\n            car.update();\n            draw();\n            requestAnimationFrame(loop);\n        }\n\n        loop();\n    <\/script>\n<\/body>\n<\/html>"};

        function showPage(pageId) {
            document.getElementById('home-view').style.display = 'none';

            container.style.display = 'flex';
            
            // Dynamically inject the HTML to start the context
            const iframe = container.querySelector('iframe');

            window.scrollTo(0, 0);
